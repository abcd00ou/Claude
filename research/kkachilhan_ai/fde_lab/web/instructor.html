<style>
/* Layout: course binder. Left index of tabs (case, data, weeks, instructor), one document open at a time on the right; prev/next at the foot like turning pages. */
:root{
  --paper:#eef1f6; --surface:#ffffff; --ink:#16213a; --ink-2:#4a5672; --rule:#cfd6e3;
  --accent:#2f4fd8; --accent-soft:#e3e8fb; --mark:#ffe14d;
  --answer:#fff7e0; --answer-rule:#d9a21b; --answer-ink:#7a5200;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
:root[data-mode="instructor"]{--accent:#b4551f; --accent-soft:#f8e6da}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --paper:#0f1524; --surface:#171f33; --ink:#e6eaf4; --ink-2:#9ea9c3; --rule:#2a3550;
    --accent:#8ea4ff; --accent-soft:#222c48; --mark:#6b5a00;
    --answer:#2a2410; --answer-rule:#c8961e; --answer-ink:#f0cf7a;}
  :root[data-mode="instructor"]:not([data-theme="light"]){--accent:#f0a070; --accent-soft:#3a2618}
}
:root[data-theme="dark"]{color-scheme:dark;
  --paper:#0f1524; --surface:#171f33; --ink:#e6eaf4; --ink-2:#9ea9c3; --rule:#2a3550;
  --accent:#8ea4ff; --accent-soft:#222c48; --mark:#6b5a00;
  --answer:#2a2410; --answer-rule:#c8961e; --answer-ink:#f0cf7a;}
:root[data-theme="dark"][data-mode="instructor"]{--accent:#f0a070; --accent-soft:#3a2618}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.72;margin:0;padding-inline:16px}
.shell{max-width:1180px;margin:0 auto;padding-block:24px 64px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px}
header.top{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;border-bottom:2px solid var(--ink);padding-bottom:14px}
header.top h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,38px);margin:0;line-height:1.15}
.badge{font-family:var(--mono);font-size:12px;letter-spacing:.06em;background:var(--accent);color:var(--surface);padding:3px 10px;border-radius:3px}
header.top p{margin:0;flex-basis:100%;color:var(--ink-2);font-size:14px}
nav.idx{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;max-height:calc(100vh - 32px);overflow:auto;display:grid;gap:14px;padding-right:4px}
nav.idx .g{display:grid;gap:2px}
nav.idx .gl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);padding:0 8px 2px}
nav.idx a{display:block;padding:5px 8px;border-radius:4px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
nav.idx a:hover{background:var(--accent-soft)}
nav.idx a[aria-current="page"]{background:var(--accent);color:var(--surface)}
nav.idx a.gated::after{content:" ·잠금";font-size:11px;opacity:.7}
.wk-t{display:block;font-size:12px;color:var(--ink-2)}
nav.idx a[aria-current="page"] .wk-t{color:inherit;opacity:.85}
select.mnav{display:none;width:100%;font:inherit;padding:8px;border:1px solid var(--rule);border-radius:4px;background:var(--surface);color:var(--ink)}
main{min-width:0}
article.doc{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:28px clamp(18px,4vw,44px) 36px}
.doc h1{font-family:var(--display);font-weight:400;font-size:clamp(24px,3.4vw,32px);line-height:1.25;margin:0 0 14px;text-wrap:balance}
.doc h2{font-size:20px;margin:34px 0 10px;padding-top:12px;border-top:1px solid var(--rule);text-wrap:balance}
.doc h3{font-size:16.5px;margin:24px 0 6px}
.doc h4{font-size:15px;margin:18px 0 4px}
.doc p,.doc li{max-width:72ch}
.doc ul,.doc ol{padding-left:22px}
.doc li+li{margin-top:3px}
.doc a{color:var(--accent)}
.doc hr{border:0;border-top:2px dashed var(--rule);margin:32px 0}
.doc blockquote{margin:14px 0;padding:10px 16px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 4px 4px 0}
.doc blockquote p{margin:6px 0}
.doc code{font-family:var(--mono);font-size:.88em;background:var(--accent-soft);padding:1px 5px;border-radius:3px}
.doc pre{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:12px 14px;overflow-x:auto;font-size:13px;line-height:1.55}
.doc pre code{background:none;padding:0}
.tw{overflow-x:auto;margin:12px 0;border:1px solid var(--rule);border-radius:4px}
.doc table{border-collapse:collapse;width:100%;font-size:13.5px}
.doc th,.doc td{text-align:left;vertical-align:top;padding:7px 10px;border-bottom:1px solid var(--rule)}
.doc thead th{background:var(--paper);font-weight:500;color:var(--ink-2);white-space:nowrap}
.doc tbody tr:last-child td{border-bottom:0}
.doc td{font-variant-numeric:tabular-nums}
.doc input[type=checkbox]{margin-right:6px}
.answer{margin-top:28px;background:var(--answer);border:1px solid var(--answer-rule);border-radius:6px;padding:4px 20px 18px}
.answer>h2:first-child{border-top:0;color:var(--answer-ink);margin-top:14px}
.answer>h2:first-child::before{content:"강사용 · ";font-family:var(--mono);font-size:13px;font-weight:500}
.notice{background:var(--answer);border:1px solid var(--answer-rule);color:var(--answer-ink);border-radius:6px;padding:12px 16px;margin-bottom:18px;font-size:14px}
.notice button{font:inherit;margin-top:8px;border:1px solid var(--answer-rule);background:var(--surface);color:var(--ink);border-radius:4px;padding:4px 12px;cursor:pointer}
.csvmeta{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--mono);font-size:12.5px;color:var(--ink-2);margin-bottom:8px}
.csvwrap{max-height:70vh;overflow:auto;border:1px solid var(--rule);border-radius:4px}
.csvwrap table{font-size:12.5px}
.csvwrap thead th{position:sticky;top:0}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
.pager a{flex:1;display:grid;gap:2px;padding:12px 14px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);text-decoration:none;color:var(--ink);font-size:14px}
.pager a:hover{border-color:var(--accent)}
.pager a span{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.pager a.next{text-align:right}
.pager a[hidden]{display:none}
a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mermaid{background:var(--surface);overflow-x:auto;text-align:center}
@media (max-width:860px){
  .shell{grid-template-columns:1fr;gap:16px}
  nav.idx{display:none}
  select.mnav{display:block}
}
@media print{nav.idx,select.mnav,.pager{display:none}.shell{display:block}}
</style>

<script>
document.documentElement.dataset.mode="instructor";
const S=[{"id": "intro", "group": "시작", "label": "랩 개요 (README)", "md": "# FDE 실습 랩: 대성모션 상품기획팀 (12주)\n\n- **작성일:** 2026-11-02 (2026-11-06 갱신: 11-02 영상의 리서치 브리프를 W5·W11에, 준비도 13번 역량 추가)\n- **상위 문서:** [../fde_curriculum.md](../fde_curriculum.md) (12주 과정 설계), [../insights.md](../insights.md) (영상 분석)\n- **목표:** 수강생이 12주 뒤 **1인 FDE로 실제 조직의 AX에 투입될 수 있는 상태**가 되는 것\n- **성격:** 회사, 인물, 데이터는 모두 교육용 **가상 자료**입니다. 방법론의 근거는 '까칠한 AI' 영상이고, 각 주차 문서에 영상 날짜를 표기했습니다. 실습 설계와 모범 답안은 정리자가 만들었습니다.\n\n---\n\n## 1. 한 팀, 한 줄기 이야기\n\n제조업 B2B 회사(서보모터·감속기) **대성모션 모션사업본부 상품기획팀**의 AX 프로젝트 하나를 12주 동안 끝까지 수행합니다. 영업, 마케팅, 상품기획이 맞물린 팀입니다.\n\n```\n W1 사전 브리프 ─ W2 스킬 3개(가정 기반) ─ W3 범용 에이전트 설계\n        │                  │                      │\n        └──────── W4 토폴로지 스캔 (숨은 키맨 윤태호, 메인테이너 후보) ─┘\n                           │\n                 W5 문제 정의: \"에이전트 5종\" → 진짜 문제 \"DX-7 판단 근거\"\n                    + 리서치 브리프: 건수 집계 대신 \"고유 회사 단위\" 접근 선택\n                           │\n                 W6 암묵지 K1~K12 → W2의 가정을 교정 (51건 → 37건)\n                           │\n                 W7 버티컬: VOC → 월간 리포트 → 분기 결정 메모\n                           │\n                 W8 내재화 설계 + 1인 FDE 부담 관리\n                           │\n     [캡스톤, 혼자 수행] W9 실전 이전 → W10 숫자 충돌 → W11 DX-7 Go/No-go → W12 인수·퇴장\n```\n\n**빌드업 장치 (앞 주차의 결과가 뒤에서 검증되는 지점)**\n\n| 앞 주차 | 뒤 주차 | 무엇이 이어지나 |\n|---|---|---|\n| W2 가정 \"카탈로그 토크로 비교\" | W6 K7 교정 | 경쟁 비교의 결론이 뒤집힘 |\n| W2 가정 \"같은 날 중복만 제거\" | W6 K8 교정 | VOC 51건 → 37건 |\n| W3 데이터 등급표를 스킬에 강제하지 않음 | W7 보안 사고 | 거버넌스의 중요성 |\n| W4 메인테이너 후보 2명 | W12 한 부장 휴직 | 백업 구조의 가치 |\n| W5 가격 시뮬레이션 보류 약속 | W11 가격 포지셔닝 | 약속 이행 |\n| W5 리서치 브리프 \"고유 회사 단위\" 선택 | W9 별칭 누락, W10 숫자 충돌 | 접근 방식이 맞았는지 검증됨 |\n| W6 K9 확인 질문 | W7 우선순위 | 가중치가 1위를 결정 |\n| W8 판단 사례 \"상황 + 판단 + 이유\" | W12 검토자 공백 | 체계가 멈추지 않음 |\n| W9 \"케이로보\" 별칭 누락 | W12 인수 확인 PR | 메인테이너 단독 처리 |\n\n---\n\n## 2. 1인 FDE로 운영하는 이유와 보완 장치\n\n- 화자는 FDE가 2~3인 팟으로 일하고 솔로 프로젝트는 피해야 한다고 말했습니다 (08-12, 07-14). 이 랩은 사용자 요구에 따라 **1인 FDE**를 목표로 합니다.\n- 그래서 팟의 역할을 다음과 같이 대체합니다.\n\n| 팟 역할 | 1인 FDE에서의 대체 |\n|---|---|\n| 서포터 | AI 에이전트. 동시 세션은 3개 이하로 제한합니다 |\n| 작업반장 | FDE 본인 + 고객 측 카운터파트(오지민)와 매일 15분 동기화 |\n| 부담 공유 | 외부 멘토 주 1회 리뷰, 매주 금요일 스폰서에게 1쪽 공유 (W8) |\n\n- 1~8주차는 수강생끼리 동료 리뷰를 합니다. 9~12주차 캡스톤은 완전히 혼자 수행합니다.\n\n---\n\n## 3. 폴더 구조\n\n```\nfde_lab/\n├── README.md                     ← 이 문서\n├── case/                         ← 수강생 공개 자료\n│   ├── 01_company.md             회사, 제품, 조직, RFP 원문\n│   ├── 02_people.md              인물 카드 (공개 정보만)\n│   └── data/\n│       ├── sales_sap_extract.csv   판매 실적 480행 (2025-07 ~ 2026-06)\n│       ├── price_list.csv          가격·원가 (대외비 A 설정)\n│       ├── voc_raw.csv             지저분한 VOC 56행\n│       ├── crm_notes.csv           영업 메모 13건\n│       ├── competitor_specs.csv    경쟁 스펙 (출처 신뢰도 혼재)\n│       ├── expo_leads.csv          전시회 리드 16건\n│       ├── prompt_log_moon.md      팀장 지시 로그 (W6부터 공개)\n│       └── interview_han.md        시니어 인터뷰 (W6부터 공개)\n├── web/\n│   ├── student.html              수강생용 강의 페이지 (실습 자료만)\n│   └── instructor.html           강사용 강의 페이지 (전체)\n├── weeks/\n│   └── week01.md ~ week12.md     주차별 [A. 실습 자료] + [B. 예상 산출물]\n└── instructor/                   ← 수강생 비공개\n    ├── case_secrets.md           숨은 정보, 롤플레이 지침, 정준 암묵지 K1~K12, 이벤트, 정답 수치\n    ├── voc_answer_key.csv        VOC 정답 라벨\n    └── solo_fde_readiness.md     13개 역량 준비도 평가, 실전 첫 2주 플레이북\n```\n\n---\n\n## 4. 운영 가이드 (강사용)\n- 매주 시작할 때 해당 주차 문서의 **A 파트만** 배포합니다. B 파트(예상 산출물)는 제출 후 피드백할 때 공개합니다.\n- `case/data/prompt_log_moon.md`와 `interview_han.md`는 6주차에 배포합니다.\n- 롤플레이 전에 `instructor/case_secrets.md` 3절(인물별 숨은 정보)을 숙지합니다. 수강생이 맞는 질문을 했을 때만 정보를 공개합니다.\n- 숫자 정답은 `case_secrets.md` 5절과 `voc_answer_key.csv`가 기준입니다. 판매 데이터는 고정 시드로 생성했으므로 다시 생성해도 같은 값이 나옵니다.\n\n## 5. 평가와 수료\n- 주차별 평가 포인트: 각 `weekNN.md` A 파트 끝\n- 캡스톤 채점 기준: [../fde_curriculum.md](../fde_curriculum.md) 4절\n- 수료 판정: `instructor/solo_fde_readiness.md`. 4번(숨은 키맨), 6번(난제와 범위 관리), 11번(내재화)은 3점이어야 \"투입 가능\"입니다.\n\n## 6. 강의용 웹페이지\n- **수강생용:** https://claude.ai/artifact/2hudkYYKEWJ3w72m9tfzeF (`web/student.html`)\n  - 케이스, 데이터 표, 주차별 A 파트만 담았습니다.\n  - 평가 포인트와 4주차 숨은 키맨 단서는 뺐습니다.\n  - 6주차 자료는 잠금 화면 뒤에 두었습니다.\n- **강사용:** https://claude.ai/artifact/QqBpHnT9cK141aV1ysMVuX (`web/instructor.html`)\n  - 주차별 A와 B 파트, 숨은 정보, 정답 키, 준비도 평가를 모두 담았습니다.\n  - 예상 산출물은 노란 상자로 구분합니다.\n- 두 페이지 모두 비공개 상태입니다. 수강생에게는 **수강생용 링크만** 공유하세요.\n- 이 폴더의 MD와 CSV를 고치면 페이지를 다시 생성해야 합니다. 생성 스크립트는 저장소의 코드 금지 규칙 때문에 저장소 밖에 있으므로, Claude에게 \"웹페이지 재생성\"을 요청하세요.\n", "csv": null, "cls": ""}, {"id": "company", "group": "케이스", "label": "회사·조직·RFP", "md": "# 케이스: 대성모션 모션사업본부 상품기획팀\n\n> **가상 회사입니다.** 회사, 인물, 수치, 경쟁사(미라텍, 한결드라이브, Kestrel Motion, Zhenli)는 모두 교육용으로 만든 것입니다. 실제 기업과 관계없습니다.\n> 수강생에게 공개하는 자료입니다. 숨은 정보는 `instructor/case_secrets.md`에 있습니다.\n\n## 1. 회사 개요\n\n| 항목 | 내용 |\n|---|---|\n| 회사명 | 대성모션(주) (가상) |\n| 업종 | 산업용 서보모터, 서보드라이브, 정밀 감속기 제조 (B2B) |\n| 규모 | 임직원 약 1,100명, 연매출 약 2,100억 원 |\n| 사업본부 | 모션사업본부(서보·감속기, 연 약 650억 원), 드라이브사업본부, 해외사업본부 |\n| 판매 채널 | 대리점, 로봇 OEM, 장비 OEM, 직판 |\n| IT 환경 | SAP ERP(판매·원가), 사내 CRM(영업 메모 위주), M365. 외부 생성형 AI는 원칙적으로 금지. R&D센터만 사내 승인 코딩 에이전트를 파일럿 운영 중 |\n\n## 2. 제품 라인업 (모션사업본부)\n\n| 제품군 | 모델 | 포지션 |\n|---|---|---|\n| DS-3 | DS3-100 / 400 / 750 / 1K5 / 3K | 범용 서보. 물량의 중심. 포장기, 공작기계, 대리점 판매 |\n| DX-5 | DX5-400 / 750 / 1K | 고정밀 서보. 로봇 OEM 매출 비중이 높음 |\n| HR | HR-40 / 60 | 정밀 감속기. 로봇 관절과 AMR용 |\n| (기획 중) DX-7 | 미정 | 협동로봇 관절용 **모터+감속기 일체형 중공축 액추에이터**. 2025년 말 컨셉만 있음 |\n| (단종) B2 | – | 2024년 출시한 저가형. 경쟁사 저가 제품에 밀려 1년 만에 철수 |\n\n**최근 실적 요약** (`data/sales_sap_extract.csv`, 단위: 백만 원)\n\n| 기간 | DS-3 | DX-5 | HR | 합계 |\n|---|---|---|---|---|\n| 2026년 상반기 | 14,470 | 12,588 | 5,025 | 32,083 |\n\n## 3. 대상 조직: 상품기획팀 (8명)\n\n```\n모션사업본부장 (강도윤 전무)\n ├─ 국내영업실 ─ 영업1팀, 영업2팀(윤태호 차장 등), 영업기획팀(최은재 차장)\n ├─ 마케팅팀 (배수빈 과장)\n └─ 상품기획팀 (문서진 팀장)\n      ├─ 한경수 부장 (시니어, 가격·포트폴리오)\n      ├─ 차장 1, 과장 2, 대리 1\n      └─ 오지민 사원 (2년차)\n지원 조직: IT·정보보안팀 (정해린 책임)\n```\n\n**상품기획팀이 반복하는 업무**\n\n| 주기 | 업무 | 산출물 | 받는 사람 |\n|---|---|---|---|\n| 주간 | 영업 VOC 취합·분류 | VOC 집계 엑셀 (\"VOC집계_v7.xlsm\") | 팀장 |\n| 주간 | 경쟁사 동향 정리 | 경쟁사 비교표 | 팀장, 영업 |\n| 월간 | 시장·VOC 리포트 | PPT 10~15장 | 본부장 |\n| 분기 | 제품 포트폴리오 리뷰 | 포트폴리오 의사결정 자료 (출시, 단종, 가격) | 본부장 주관 회의 |\n| 수시 | 가격 정책안, 특판가 검토 | 가격 검토 메모 | 영업, 본부장 |\n| 수시 | 신제품 기획서 (PRD) | 기획서 | 본부장, R&D |\n\n## 4. 원래 RFP (고객사가 처음 보낸 요청서 원문)\n\n> **[제안요청서] 상품기획 업무 AI 에이전트 구축**\n>\n> 1. **목적:** 생성형 AI를 활용한 상품기획 업무 자동화와 고도화\n> 2. **범위:** 아래 AI 에이전트 5종 구축\n>    - ① VOC 자동 분류 에이전트\n>    - ② 경쟁사 동향 모니터링 에이전트\n>    - ③ 월간 리포트 자동 작성 에이전트\n>    - ④ 가격 시뮬레이션 에이전트\n>    - ⑤ 신제품 기획서 초안 작성 에이전트\n> 3. **기간:** 구축 6개월, 이후 유지보수 12개월 (별도 계약)\n> 4. **산출물:** 에이전트 5종(소스 포함), 사용자 매뉴얼, 운영자 교육 1회\n> 5. **조건:** 사내 보안 규정 준수(외부 클라우드 전송 금지 데이터 포함). 대시보드 제공\n> 6. **평가:** 기술 60%, 가격 40%\n>\n> — 대성모션 모션사업본부 상품기획팀\n\n## 5. 공개된 배경 정보\n- 2026년 상반기 협동로봇 고객의 문의가 늘었습니다.\n- 경쟁사 미라텍이 2026년 5월 전시회에서 일체형 중공축 제품(MR-H70J)을 공개했습니다.\n- 본부장은 2026년 3분기 이사회에 \"AI 활용 성과\"를 보고해야 합니다.\n- 상품기획팀의 분기 포트폴리오 리뷰 준비에는 통상 2주가 걸립니다.\n\n## 6. 데이터 패키지 (`case/data/`)\n\n| 파일 | 내용 | 상태 |\n|---|---|---|\n| `sales_sap_extract.csv` | 2025년 7월~2026년 6월 모델·고객유형별 판매 (SAP 마감 기준) | 정제됨 |\n| `price_list.csv` | 표준가, 표준원가, 대리점 공급가 | 정제됨 |\n| `voc_raw.csv` | 2026년 4~6월 영업 VOC 56행 (카톡, 전화, CRM 혼재) | **지저분함**: 날짜 형식 4가지, 고객명 변형, 중복, 분류 누락 |\n| `crm_notes.csv` | 영업 CRM 메모 13건 | 할인 조건과 VOC가 섞여 있음 |\n| `competitor_specs.csv` | 자사와 경쟁사 스펙, 가격, 납기 | 출처 신뢰도가 제각각 |\n| `expo_leads.csv` | 2026 전시회 리드 16건 | 방문만 한 리드 포함 |\n| `prompt_log_moon.md` | 문서진 팀장의 에이전트 지시 로그 1주일치 (6주차부터 공개) | |\n| `interview_han.md` | 한경수 부장 인터뷰 녹취 요약 (6주차부터 공개) | |\n", "csv": null, "cls": ""}, {"id": "people", "group": "케이스", "label": "인물 카드", "md": "# 인물 카드 (수강생 공개용)\n\n> 가상 인물입니다. 수강생은 여기 적힌 정보만 알고 시작합니다.\n> 롤플레이에서 강사가 이 인물들을 연기합니다. 각 인물의 숨은 정보는 `instructor/case_secrets.md`에 있습니다.\n\n| 인물 | 직책 | 공개된 역할 | 첫 미팅에서 하는 말 |\n|---|---|---|---|\n| **강도윤** | 전무, 모션사업본부장 | 이번 프로젝트의 스폰서. RFP 결재자 | \"경쟁사는 AI로 신제품을 낸다던데, 우리도 상품기획을 빠르게 하고 싶습니다.\" |\n| **문서진** | 상품기획팀장 | 실무 책임자. RFP 작성자 | \"에이전트 5개를 만들어 주시면 됩니다. 요건은 RFP에 다 있어요.\" |\n| **한경수** | 상품기획팀 부장 | 가격과 포트폴리오 담당 시 리면 난리 나.\n\n**[07-08 14:00]** 전시회 리드 정리. 배 과장이 준 리스트.\n\n**[07-08 14:15] 피드백:** 그냥 부스에 들른 건 리드 아니야. 샘플이나 견적 달라고 한 것만 세.\n\n**[07-08 16:30]** Zhenli 대응 메시지 초안. 대리점용.\n\n**[07-08 16:50] 피드백:** 가격으로 싸우면 진다. 수명, 튜닝 시간, AS 포함해서 총비용으로 말하는 걸로 바꿔. 마케팅이랑 늘 그렇게 해 왔어.\n\n**[07-09 09:00]** 분기 리뷰 자료 목차 잡아줘.\n\n**[07-09 09:25] 피드백:** 단종 후보 페이지 넣어. 기준은 한 부장님한테 확인해. 나도 정확히는 몰라. 2분기 연속 빠지는 거였나.\n\n**[07-09 11:10]** 영업에서 온 \"신규요구 수요 2,400대\" 숫자 리포트에 넣어줘.\n\n**[07-09 11:30] 피드백:** 잠깐, 영업이 말하는 수요는 견적 요청 수량이야. 우리는 수주 확정 기준으로 써. 같은 단어인데 뜻이 달라. 둘 다 쓸 거면 어느 기준인지 꼭 적어.\n\n**[07-09 15:00]** 특판가 요청 건 검토 메모. 성우자동화 DS3-100.\n\n**[07-09 15:20] 피드백:** 영업은 12%까지라고 했다는데 우리 기준은 15%야. 근데 대리점 마진 선은 한 부장님 기준이 따로 있어. 그건 부장님한테 물어봐.\n\n**[07-10 10:00]** 이번 주 한 일 정리해줘.\n\n**[07-10 10:30] 피드백:** 좋아. 근데 내가 이번 주에 너한테 말한 규칙들, 다음 주에도 기억해야 돼. 오 사원이 써도 똑같이 나오게.\n", "csv": null, "cls": ""}, {"id": "han", "group": "데이터", "label": "시니어 인터뷰 (6주차)", "md": "# 한경수 부장 인터뷰 녹취 요약 (2026-07-08, 60분)\n\n> 6주차 실습 자료입니다. 가상 자료입니다. FDE가 \"부장님 방식을 남기는 것\"이라고 설명한 뒤 진행한 인터뷰입니다.\n\n**Q. 특판가 요청이 오면 어떻게 판단하세요?**\n대리점 건이면 먼저 대리점 마진을 봅니다. 18% 밑으로는 절대 안 내려요. 대리점이 손해 보면 다음 분기에 우리 물건을 안 밀어요. 2019년에 한 번 그걸 깨서 대리점 두 곳이 경쟁사로 넘어갔습니다.\n\n**Q. 할인 한도는 영업 기준이랑 상품기획 기준이 다르던데요.**\n영업은 12%로 알고 있을 거예요. 예전 기준입니다. 2024년에 우리가 15%로 올렸는데 영업 교육이 안 됐어요. 로봇 OEM은 전무님 승인을 받으면 20%까지 됩니다. 물량 약속(LOI)이 있을 때만요.\n\n**Q. 경쟁사 비교는요?**\n카탈로그 최대 토크는 의미가 없어요. 순간값이라 다들 부풀립니다. 데이터시트의 연속 토크로 비교해야 진짜 비교예요. 데이터시트가 없으면 \"미확보\"라고 쓰고, 비교 결론은 내지 말아야 합니다.\n\n**Q. 단종은 어떻게 판단하세요?**\n제 기준은 두 분기 연속 매출이 빠지고 마진율이 22% 밑이면 단종 검토에 올리는 거예요. 바로 단종이 아니라 \"검토\"입니다. 대체 모델이 있는지, 대리점 재고가 얼마나 남았는지도 같이 봐야 해요.\n\n**Q. \"수요\"라는 말이 부서마다 다르게 쓰이는 것 같습니다.**\n영업한테 수요는 견적 들어온 숫자고, 우리한테는 수주 확정이에요. 그래서 회의 때 숫자가 늘 안 맞습니다. 20년째 그래요.\n\n**Q. 퇴직하시면 이런 판단은 누가 하나요?**\n그게 걱정이에요. 문 팀장도 다는 몰라요. 오 사원이 빠르긴 한데 아직 경험이 없고요. 제 기준이 어디 적혀 있으면 좋겠는데, 적어 놓으면 사람들이 상황을 안 보고 기계적으로 쓸까 봐 안 적었어요.\n", "csv": null, "cls": ""}, {"id": "w1", "group": "주차별 실습", "label": "1주차", "md": "# 1주차: FDE란 무엇인가 + 케이스 사전 브리프\n\n- **모듈:** M1\n- **근거 영상:** 08-12, 09-30, 10-09\n- **이번 주에 이어받는 것:** 없음 (출발점)\n- **다음 주로 넘기는 것:** 사전 브리프 v1, FDE 제안서 v0 → 3주차 아키텍처 설계와 5주차 SOW의 바탕이 됩니다.\n\n---\n\n## A. 실습 자료\n\n### 상황\n여러분은 1인 FDE입니다. 대성모션 상품기획팀이 보낸 RFP(`case/01_company.md` 4절)를 받았습니다. 고객사 미팅은 4주차부터 시작합니다. 그 전에 공개 자료만 가지고 준비합니다.\n\n### 입력 자료\n- `case/01_company.md`, `case/02_people.md`\n- `case/data/sales_sap_extract.csv`, `price_list.csv`, `competitor_specs.csv`\n  - 실제 프로젝트였다면 미팅 전에는 받지 못하는 자료입니다. 교육 편의상 공개 실적 수준의 자료로 간주합니다.\n\n### 과제\n1. **사전 브리프 (1~2쪽):** 고객사에 들어가기 전에 알고 있어야 할 것을 정리합니다.\n   - 사업 구조\n   - 실적 추세\n   - 경쟁 상황\n   - 이해관계자 가설\n   - 미팅에서 확인할 질문 10개\n2. **RFP 다시 읽기:** RFP에서 \"SI 문법\"에 해당하는 부분을 표시하고, 그 이유를 적습니다.\n3. **FDE 제안서 v0 (1쪽):** 같은 요청을 FDE 방식으로 다시 씁니다.\n   - 필수 항목: 기간, 투입 형태, 첫 4주 활동, 종료 조건, 산출물\n\n### 제출 양식\n```\n1-1_사전브리프_v1.md\n1-2_RFP_분석.md\n1-3_FDE제안서_v0.md\n```\n\n### 평가 포인트\n- 데이터에서 숫자를 직접 뽑아 썼는가. 특히 DS3-100의 하락과 DX-5의 로봇 OEM 의존도를 짚었는가.\n- RFP의 \"에이전트 5종 구축 + 유지보수 12개월 별도\"가 왜 문제인지 08-12와 07-06 영상의 논리로 설명했는가.\n- 제안서에 **내재화 산출물**과 **종료 조건**이 들어 있는가.\n\n---\n\n## B. 예상 산출물\n\n### 1-1. 사전 브리프 v1 (모범 답안)\n\n**1) 사업 구조**\n- 모션사업본부의 연매출은 약 650억 원으로 회사의 약 31%입니다.\n- 제품군은 DS-3(범용), DX-5(고정밀, 로봇), HR(감속기) 세 가지입니다.\n- 일체형 DX-7은 컨셉 단계에 있습니다.\n\n**2) 실적 추세** (SAP 추출 데이터, 2025년 7월~2026년 6월)\n\n| 관찰 | 근거 수치 |\n|---|---|\n| 2026년 상반기 매출 320.8억 원 | DS-3 144.7억, DX-5 125.9억, HR 50.3억 |\n| **DX-5가 성장을 이끎** | DX5-750 분기 매출 17.0억 → 21.8억 → 26.9억 → 34.6억 (26Q2 전분기 대비 +28.8%) |\n| **DX-5는 로봇 OEM에 의존** | DX-5 상반기 매출의 53.6%(67.5억)가 로봇 OEM |\n| **DS3-100은 하락하고 저마진** | 분기 매출 8.0억 → 6.6억 → 5.5억 → 4.7억. 마진율 20.3% → 18.6% |\n\n**3) 경쟁 상황** (`competitor_specs.csv`)\n- 미라텍이 일체형 중공축 제품 MR-H70J를 공개했습니다. 해외 Kestrel KM-J80도 일체형입니다.\n- **우리에게는 일체형 제품이 없습니다.**\n- 저가 시장에서는 Zhenli ZL-100이 245천 원으로, 우리 DS3-100(380천 원)보다 35.5% 쌉니다.\n- 출처 신뢰도가 제각각입니다. 데이터시트, 카탈로그, 구두 확인이 섞여 있습니다.\n\n**4) 이해관계자 가설** (4주차에 검증)\n\n| 인물 | 가설 |\n|---|---|\n| 강 전무 | 진짜 관심사는 리포트 자동화보다 \"신제품(일체형) 결정\"일 것이다 |\n| 문 팀장 | RFP 5종은 희망 목록이다. 실제 고통은 반복 집계 업무일 것이다 |\n| 한 부장 | 가격·포트폴리오 판단 노하우의 보유자일 것이다 |\n| 오 사원 | VOC 취합 실무자이며 메인테이너 후보일 수 있다 |\n| 정 책임 | 프로젝트 성패를 가를 거버넌스 게이트키퍼다 |\n| (미확인) | VOC 원천을 가진 영업 쪽 키맨이 따로 있을 것이다 |\n\n**5) 첫 미팅 확인 질문 10개**\n1. 이 프로젝트가 성공하면 본부장님은 누구에게 무엇을 보고하시나요?\n2. 에이전트 5개 중 하나만 된다면 무엇이 남아야 하나요?\n3. VOC 원본은 누가, 어디에, 어떤 형식으로 모으나요?\n4. 분기 포트폴리오 리뷰 준비 2주 중 가장 오래 걸리는 단계는 무엇인가요?\n5. 일체형(DX-7) 출시는 지금 누가, 언제, 어떤 기준으로 결정하나요?\n6. 가격과 특판가 판단은 누가 하고, 그 기준은 어디에 적혀 있나요?\n7. 외부로 나가면 안 되는 데이터는 무엇이고, 사내에 승인된 AI 도구가 있나요?\n8. 지난번 신제품(B2)의 결정 과정에서 무엇이 아쉬웠나요?\n9. 프로젝트가 끝난 뒤 이 일을 계속 돌볼 사람은 누구인가요?\n10. 영업과 상품기획이 숫자를 맞출 때 자주 생기는 문제는 무엇인가요?\n\n### 1-2. RFP 분석 (모범 답안)\n\n| RFP 항목 | SI 문법인가 | 이유 (근거 영상) |\n|---|---|---|\n| 에이전트 5종 구축 | 예 | 업무 단위로 에이전트를 짓는 것은 SI 방식의 반복입니다. 5종이 50종이 되면 유지보수 지옥이 됩니다 (07-06) |\n| 구축 6개월 + 유지보수 12개월 별도 | 예 | 구축과 유지보수를 나누면, AI가 빠르게 바뀌는 속도를 따라가지 못합니다. 외부가 유지보수하면 결국 녹이 습니다 (03-11, 08-12) |\n| 산출물이 \"소스 + 매뉴얼 + 교육 1회\" | 예 | 내재화가 아니라 납품입니다. 교육 1회로는 메인테이너가 생기지 않습니다 (09-30) |\n| 대시보드 제공 | 부분적으로 | 보고 레이어 요구는 타당합니다. 다만 누가 어떤 결정을 위해 보는지가 빠져 있습니다 (06-11) |\n| 기술 60 / 가격 40 평가 | 참고 | 문제 정의 역량을 평가하는 항목이 없습니다 |\n| 보안 규정 준수 | 아님, 타당 | 데이터 등급별 접근 채널을 설계해야 합니다 (03-11) |\n\n### 1-3. FDE 제안서 v0 (모범 답안)\n\n**제목:** 상품기획 의사결정 가속 프로젝트 (12주, 1인 FDE)\n\n| 항목 | 내용 |\n|---|---|\n| 목표 | \"에이전트 5종\"이 아니라, 상품기획팀이 **사내 승인 범용 에이전트 하나로 반복 업무와 보고를 처리하는 상태**를 만듭니다 |\n| 투입 | FDE 1명이 주 4일 상주합니다. 고객 측 카운터파트 1명(메인테이너 후보) 지정을 요청합니다 |\n| 첫 4주 | ① 이해관계자 인터뷰와 토폴로지 스캔 ② 데이터 등급 분류와 접근 채널 합의 ③ 문제 정의서와 우선순위 1건 합의 |\n| 5~12주 | 우선순위 업무 1건을 실무부터 본부장 보고까지 버티컬로 구현하고, 메인테이너를 양성합니다 |\n| 종료 조건 | 고객사 메인테이너가 FDE 없이 규칙 변경 1건을 처리하고, 월간 보고 1회를 직접 생성합니다 |\n| 산출물 | 토폴로지 맵, 문제 정의서, 에이전트 세팅(지침·스킬·데이터 연결), 컨텍스트 그래프, 평가 리포트, 인수 패키지 |\n| 하지 않는 것 | 업무별 개별 에이전트 개발, 12개월 외부 유지보수 계약 |\n", "csv": null, "cls": ""}, {"id": "w2", "group": "주차별 실습", "label": "2주차", "md": "# 2주차: AI 빌더 되기 (비가역 자동화와 멀티태스킹)\n\n- **모듈:** M2\n- **근거 영상:** 02-27, 03-17, 03-26, 04-30, 07-14\n- **이어받는 것:** 1주차 사전 브리프 (어떤 반복 업무가 있는지)\n- **넘기는 것:** 재사용 가능한 스킬 3개 → 3주차 워크 OS 설계의 부품, 7주차 버티컬 워크플로의 1단계\n\n---\n\n## A. 실습 자료\n\n### 상황\n고객사에 들어가기 전에 FDE 본인이 먼저 AI 빌더가 되어야 합니다. 상품기획팀의 반복 업무 3개를 케이스 데이터로 미리 자동화해 봅니다. 이번 주 결과물은 **나중에 고객 환경에 그대로 옮길 부품**입니다.\n\n### 작업 환경 세팅 (첫날)\n- 범용 코딩 에이전트 1개 (Claude Code, Codex 등 중 하나)\n- 세션 유지 환경 (tmux 또는 그에 준하는 도구)\n- 작업 폴더 구조\n  ```\n  fde-daesung/\n  ├── AGENTS.md (또는 CLAUDE.md)   ← 프로젝트 공통 지침\n  ├── skills/                      ← 업무별 스킬\n  ├── data/                        ← case/data 복사본\n  └── out/                         ← 산출물\n  ```\n- **AX 타임:** 매일 2시간은 엑셀이나 문서 도구를 직접 열지 않습니다. 10분 단위로 진행 상황을 스레드에 남깁니다.\n\n### 과제: 자동화 3건\n1. **VOC 정제 스킬:** `voc_raw.csv` → 정규화된 VOC 테이블\n   - 날짜 통일, 고객명 정규화, 7개 분류\n2. **경쟁사 비교표 스킬:** `competitor_specs.csv` → 750W급 비교표\n   - 출처 신뢰도 표시\n3. **주간 영업 하이라이트 스킬:** `crm_notes.csv` → 주간 하이라이트 1쪽\n\n### 제약\n- 아직 고객 인터뷰 전입니다. 상품기획팀의 내부 규칙(암묵지)은 모르는 상태로 만듭니다. **모르는 부분은 \"가정\"으로 명시합니다.**\n- 동시 세션은 최대 3개까지만 돌립니다. 각 세션의 결과를 직접 검수한 기록을 남깁니다.\n\n### 제출 양식\n```\n2-1_환경세팅.md          (도구, 폴더, 공통 지침 전문)\n2-2_skills/voc_clean.md, competitor_table.md, weekly_highlight.md\n2-3_자동화보고서.md      (전후 비교, 가정 목록, 검수 기록, \"업무가 정말 없어졌나\" 판정)\n```\n\n### 평가 포인트\n- 스킬이 **지침 파일** 형태인가. 업무마다 별도 프로그램을 짜지 않았는가 (3주차와 연결).\n- 가정을 명시했는가. 이 가정들이 6주차에 암묵지로 교정되는 것이 이 과정의 빌드업입니다.\n- 검수 기록이 있는가 (07-14 영상: 검수 가능한 단위로 쪼개기).\n\n---\n\n## B. 예상 산출물\n\n### 2-1. 공통 지침 (AGENTS.md) 예시\n```markdown\n# 대성모션 상품기획 작업 지침 (v0.1, 2026-W2, 가정 기반)\n- 언어: 한국어. 결과는 out/ 아래 날짜별 폴더에 저장한다.\n- 원본 data/는 수정하지 않는다. 가공본은 out/에 쓴다.\n- 숫자를 쓸 때는 반드시 출처 파일과 기간을 함께 적는다.\n- 모르는 규칙은 지어내지 말고 \"가정:\"으로 표시한 뒤 보고서 끝에 모은다.\n- 단가, 할인율이 담긴 컬럼은 요약에 쓰지 않는다. (보안 등급 미확인, 보수적으로 처리)\n```\n\n### 2-2. 스킬 예시: `skills/voc_clean.md`\n```markdown\n# VOC 정제 스킬 (v0.1)\n입력: data/voc_raw.csv\n출력: out/voc_clean.csv\n       컬럼: 접수일(YYYY-MM-DD), 고객_정규화, 담당영업, 채널, 내용, 분류, 중복여부\n\n1. 날짜: \"6/3\", \"2026.6.3\", \"26년 6월 3일\"을 모두 2026-06-03 형식으로 바꾼다.\n2. 고객명: 별칭 사전으로 정규화한다.\n   누리로봇, (주)누리로보틱스, Nuri → 누리로보틱스\n   세온로보, SEON → 세온\n   ARKBOT, 아크봇(주) → 아크봇\n   동진 → 동진기계 / 한일PKG → 한일패키징 / 성우 → 성우자동화\n   대명에프에이 → 대명FA / Greentech → 그린텍\n3. 분류: 신규요구, 성능, SW·튜닝, 가격, 품질, 납기, 기술지원 중 하나. 원본 분류 칸은 신뢰하지 않는다.\n4. 중복: 같은 날, 같은 고객, 같은 내용이면 중복으로 표시한다.\n   가정: 날짜가 다른 같은 내용은 별건으로 본다. → 고객 확인 필요\n5. 끝에 분류별 건수와 가정 목록을 출력한다.\n```\n\n### 2-3. 자동화 보고서 (핵심 수치)\n\n**VOC 정제 (가정 기반 v0.1 결과)**\n\n| 항목 | 값 |\n|---|---|\n| 원본 행 수 | 56 |\n| 완전 중복(같은 날, 같은 고객, 같은 내용) 제거 | 5건 제거 → 51건 |\n| 분류별 건수 | 7개 분류로 배정. 아래 참고 |\n\n- v0.1 규칙은 날짜가 다른 반복 제기를 별건으로 셉니다. 그래서 정답 키(37건)보다 많은 51건이 남습니다.\n- **이 차이가 6주차에 K8(\"같은 고객의 같은 이슈 반복은 1건\")로 교정됩니다.** 수강생 결과가 51건 근처이면 정상입니다.\n- 이번 주에는 7개 분류를 모두 포함합니다. 납기와 품질을 리포트에서 빼는 규칙(K3)은 아직 모르는 단계이고, 4~6주차에 발견합니다.\n\n**가정 목록 (모범 답안에 반드시 있어야 할 것)**\n1. 날짜가 다른 같은 내용은 별건으로 본다.\n2. 모든 분류를 상품기획 리포트에 포함한다.\n3. 모든 고객의 요청을 같은 가중치로 센다.\n4. 경쟁사 비교는 카탈로그 최대 토크 기준이다. **(틀린 가정이며, 6주차 K7로 교정됩니다)**\n\n**경쟁사 비교표 v0.1 (카탈로그 기준)**\n\n| 모델 | 최대 토크 (Nm) | 가격 (천원) | 납기 (주) | 출처 |\n|---|---|---|---|---|\n| 대성 DX5-750 | 7.16 | 1,180 | 10 | 데이터시트 |\n| 미라텍 MR-A750 | **7.5** | 1,090 | 6 | 카탈로그 |\n| 한결 HG-750S | 7.2 | 1,120 | 7 | 데이터시트 |\n\n- 이 표만 보면 \"미라텍이 토크가 높고 더 싸다\"는 결론이 나옵니다.\n- 6주차 재작업에서 연속 토크로 비교하면 **대성 2.39 vs 미라텍 2.25**로 결론이 뒤집힙니다. 이것이 빌드업 포인트입니다.\n\n**주간 하이라이트 v0.1 (요지)**\n- 로봇 OEM 3사(아크봇, 세온, 누리로보틱스)가 일체형 또는 중공축을 반복해서 요구합니다. 세온 RFQ 마감은 7월 31일로 연장되었습니다.\n- 누리로보틱스가 DX5-750 연 2,400대 LOI를 검토 중입니다. 20% 할인과 8주 납기를 요구합니다.\n- DS3-100은 대리점 재고 340대가 있고, Zhenli 저가 공세를 받고 있습니다. 단종 루머 문의가 있습니다.\n- 할인 기준이 영업 메모(12%)와 상품기획 기준(15%)에서 다르게 나옵니다. 확인이 필요합니다.\n\n**\"업무가 정말 없어졌나\" 판정**\n\n| 업무 | 판정 |\n|---|---|\n| VOC 정제 | 부분적으로만. 규칙 미확정 때문에 사람이 검수해야 합니다 |\n| 경쟁사 비교 | 아니오. 비교 기준을 확인해야 합니다 |\n| 주간 하이라이트 | 예. 초안 생성은 대체되었습니다 |\n\n→ **결론:** 고객의 암묵지 없이는 비가역적 자동화가 불가능합니다. 이것이 4~6주차의 존재 이유입니다.\n", "csv": null, "cls": ""}, {"id": "w3", "group": "주차별 실습", "label": "3주차", "md": "# 3주차: 범용 에이전트와 워크 OS (RFP 재설계)\n\n- **모듈:** M3\n- **근거 영상:** 07-06, 08-20, 03-11, 04-30\n- **이어받는 것:** 1주차 RFP 분석과 제안서 v0, 2주차 스킬 3개와 공통 지침\n- **넘기는 것:** 아키텍처 설계서 v1과 데이터 등급 매트릭스 → 4주차 정해린 책임 인터뷰의 준비물이자 5주차 SOW의 기술 부분\n\n---\n\n## A. 실습 자료\n\n### 상황\nRFP는 \"에이전트 5종\"을 요구합니다. 여러분은 이를 **범용 에이전트 1개 + 스킬 + 데이터 채널 + 거버넌스** 구조로 다시 설계해서, 4주차 첫 미팅에 가져갑니다.\n\n### 과제\n1. **매핑:** RFP 에이전트 5종을 \"범용 에이전트가 수행할 스킬\"로 다시 매핑합니다. 2주차에 만든 스킬 3개를 재사용합니다.\n2. **데이터 등급 매트릭스 초안:** 데이터 6종 각각에 대해 다음을 추정합니다.\n   - 보안 등급 가설\n   - 에이전트에 넣을 수 있는 형태\n   - 데이터 소유자\n3. **거버넌스 초안**\n   - 누가 스킬과 지침을 바꿀 수 있는가\n   - 변경은 어떻게 검토하는가\n   - 로그는 어떻게 남기는가\n4. **유지보수 시나리오:** 2027년 1월에 \"VOC 분류에 '안전·인증'이 추가된다\"고 가정합니다. RFP 방식과 우리 방식의 수정 범위를 비교합니다.\n\n### 제출 양식\n```\n3-1_아키텍처설계서_v1.md\n3-2_데이터등급매트릭스_v0.md\n3-3_유지보수시나리오.md\n```\n\n### 평가 포인트\n- 개별 에이전트 개발이 0건인가 (07-06).\n- 단가와 할인이 담긴 데이터를 별도 등급으로 분리했는가 (7주차 이벤트를 미리 대비).\n- 기업이 쥐어야 할 것을 \"에이전트\"가 아니라 \"데이터 채널과 지침·컨텍스트\"로 정의했는가.\n\n---\n\n## B. 예상 산출물\n\n### 3-1. 아키텍처 설계서 v1 (요지)\n\n**구조**\n```\n[사내 승인 범용 에이전트 1개]  ← 상품기획팀 전원이 같은 환경을 사용\n   │\n   ├─ 공통 지침 (AGENTS.md): 회사·팀 규칙, 보고 스타일\n   ├─ 스킬 (skills/*.md): 업무별 절차\n   ├─ 컨텍스트 그래프 (knowledge/): 암묵지, 용어집, 출처 태그  ← 6주차에 구축\n   └─ 데이터 채널 (등급별)\n        ├─ 일반:        경쟁사 공개 스펙, 전시회 리드, 집계 실적\n        ├─ 내부:        VOC (할인 조건 마스킹 후)\n        └─ 대외비 A:    단가, 고객별 할인 → 에이전트에 원본 투입 금지. 집계 결과만 사용\n```\n\n**RFP 5종 → 스킬 매핑**\n\n| RFP 요청 | 우리 방식 | 상태 |\n|---|---|---|\n| ① VOC 자동 분류 에이전트 | `voc_clean` 스킬 | 2주차 v0.1 존재 |\n| ② 경쟁사 동향 모니터링 에이전트 | `competitor_table` 스킬 + 주간 실행 | 2주차 v0.1 존재 |\n| ③ 월간 리포트 자동 작성 에이전트 | `monthly_report` 스킬 (①②의 출력과 보고 스타일 지침을 조합) | 7주차 |\n| ④ 가격 시뮬레이션 에이전트 | `price_review` 스킬 (대외비 데이터는 집계 결과만 사용) | 캡스톤 |\n| ⑤ 신제품 기획서 초안 에이전트 | `prd_draft` 스킬 | 캡스톤 (DX-7) |\n\n**기업이 쥐는 것:** 데이터 채널, 공통 지침, 스킬, 컨텍스트 그래프. 모두 텍스트와 데이터이며 고객사 소유입니다. 범용 에이전트 제품이 바뀌어도 그대로 옮길 수 있습니다.\n\n### 3-2. 데이터 등급 매트릭스 v0 (가설)\n\n| 데이터 | 등급 가설 | 에이전트 투입 형태 | 소유자 (가설) | 4주차 확인 대상 |\n|---|---|---|---|---|\n| SAP 판매 실적 | 내부 (단가 포함 시 대외비 A) | 모델·고객유형별 집계만 | 영업기획 최은재 | 최은재, 정해린 |\n| 가격표 (원가 포함) | 대외비 A | 투입 금지. 마진율 계산 결과만 | 상품기획 한경수 | 정해린 |\n| VOC 원본 | 내부 (할인 문구 포함 시 대외비 A) | 할인 문구 마스킹 후 투입 | **미상** (영업 쪽 누군가) | 오지민 → ? |\n| CRM 메모 | 대외비 A 가능성 | 마스킹 후 투입 | 영업 | 정해린 |\n| 경쟁사 스펙 | 일반 | 원본 투입 | 상품기획 | – |\n| 전시회 리드 | 내부 | 원본 투입 | 마케팅 배수빈 | 배수빈 |\n\n### 3-3. 유지보수 시나리오: \"안전·인증\" 분류 추가\n\n| | RFP 방식 (에이전트 5종) | 우리 방식 |\n|---|---|---|\n| 수정 대상 | VOC 분류 에이전트의 코드와 프롬프트, 월간 리포트 에이전트, 대시보드 | `voc_clean.md`의 분류 목록 1줄, 컨텍스트 그래프의 분류 정의 1개 |\n| 누가 하나 | 외주 유지보수 업체 (변경 요청 → 견적 → 개발) | 고객사 메인테이너가 지식 PR로 수정 → 팀장이 승인 |\n| 소요 | 수 주 | 하루 이내 |\n| 위험 | 외주 계약이 끝나면 방치됨 | 지식 PR 검토자가 없으면 품질 저하 → 8주차 인수 계획으로 대응 |\n", "csv": null, "cls": ""}, {"id": "w4", "group": "주차별 실습", "label": "4주차", "md": "# 4주차: 토폴로지 스캔 (고객사 진입)\n\n- **모듈:** M4\n- **근거 영상:** 10-05, 08-12\n- **이어받는 것:** 1주차 이해관계자 가설과 질문 10개, 3주차 데이터 등급 매트릭스 v0\n- **넘기는 것:** 토폴로지 맵 v2, 메인테이너 후보, 확정된 데이터 등급표 → 5주차 문제 정의, 8주차와 12주차 메인테이너 선정\n\n---\n\n## A. 실습 자료\n\n### 진행 방식 (롤플레이)\n- 강사들이 `instructor/case_secrets.md`의 인물을 연기합니다.\n- 수강생은 1인 FDE로 혼자 인터뷰합니다.\n\n| 날 | 일정 |\n|---|---|\n| 1일차 | 강도윤, 문서진, 한경수와 각 45분 인터뷰 → 토폴로지 맵 v1 |\n| 2일차 | 오지민, 배수빈, 최은재, 정해린 중 3명 이상과 인터뷰. **추가 인터뷰를 요청할 권한이 있습니다** → 맵 v2 |\n| 3일차 | 문서진 팀장과 맵을 함께 검토 (30분) |\n\n**이벤트:** 1일차 인물 목록에 윤태호 차장이 없습니다.\n\n### 인터뷰 가이드 (수강생 배포용)\n- 1주차 질문 10개를 재사용합니다.\n- 인물마다 다음 세 가지를 꼭 묻습니다.\n  1. 이 일이 잘되면 누구에게 칭찬받나요?\n  2. 지금 가장 시간이 많이 드는 일은 무엇인가요?\n  3. 이 데이터는 누구에게서 받나요?\n- 3주차 데이터 등급 매트릭스를 들고 가서 정해린 책임에게 확인받습니다.\n\n### 맵 작성 규칙\n- **노드:** 인물. 역할, 진짜 KPI, 영향력(상/중/하)을 적습니다.\n- **선:** 데이터 흐름(→)과 보고 흐름(⇢)을 구분합니다.\n- 메인테이너 후보를 ★로 표시합니다.\n- 프로젝트가 실패할 때 가장 곤란해지는 사람을 ⚠로 표시합니다.\n\n### 제출 양식\n```\n4-1_토폴로지맵_v1.md, 4-1_토폴로지맵_v2.md  (mermaid 다이어그램 + 변경 이유)\n4-2_인터뷰노트.md\n4-3_데이터등급표_확정.md\n```\n\n### 평가 포인트 (강사 체크리스트)\n- [ ] 윤태호 차장을 찾아 인터뷰를 요청했는가 (**핵심**)\n- [ ] 강 전무의 진짜 KPI(\"이사회 사례 1건, DX-7 결정\")를 끌어냈는가\n- [ ] 문 팀장에게서 \"하나만 된다면\"이라는 질문으로 진짜 우선순위를 얻었는가\n- [ ] 한 부장에게 \"자동화\"가 아니라 \"방식을 남기기\"로 접근했는가\n- [ ] 정 책임에게서 사내 승인 에이전트의 존재와 확장 조건을 알아냈는가\n- [ ] 메인테이너 후보를 2명(시니어와 주니어) 제시했는가\n\n---\n\n## B. 예상 산출물\n\n### 4-1. 토폴로지 맵 v2 (모범 답안)\n\n```mermaid\nflowchart TB\n  KANG[\"강도윤 전무 ⚠<br/>KPI: 이사회 AI 사례 · DX-7 결정<br/>영향력 상\"]\n  MOON[\"문서진 팀장<br/>KPI: 분기리뷰 2주→3일<br/>매크로 v7 보유 (병목)\"]\n  HAN[\"한경수 부장 ★A<br/>가격·단종 기준 보유<br/>2027-06 정년\"]\n  OH[\"오지민 사원 ★B<br/>VOC 취합 · AI 경험\"]\n  YOON[\"윤태호 차장 (숨은 키맨)<br/>VOC 원천 · 로봇 OEM<br/>할인 노출 우려\"]\n  BAE[\"배수빈 과장<br/>전시회 리드\"]\n  CHOI[\"최은재 차장<br/>SAP 데이터 · 월마감 1~5영업일\"]\n  JUNG[\"정해린 책임 (게이트)<br/>사내 승인 에이전트 확장 승인\"]\n  YOON -->|VOC·카톡·CRM| OH\n  BAE -->|리드 리스트| OH\n  CHOI -->|SAP 추출| MOON\n  OH -->|VOC 집계| MOON\n  HAN -->|가격·단종 판단| MOON\n  MOON -.->|월간·분기 보고| KANG\n  JUNG -.->|데이터 반출 승인| MOON\n```\n\n**v1 → v2에서 바뀐 점과 이유**\n\n| 변경 | 이유 |\n|---|---|\n| 윤태호 차장 추가 | 오지민 인터뷰에서 \"VOC는 윤 차장님이 영업사원들한테 모아서 줘요\"를 확인했습니다. 3주차 매트릭스의 \"VOC 소유자 미상\"이 해소되었습니다 |\n| 정해린을 게이트로 표시 | R&D용 사내 승인 에이전트가 이미 있습니다. 확장 신청서와 데이터 분류표가 필요합니다 |\n| 강 전무의 KPI 수정 | \"리포트 자동화\"가 아니라 \"이사회 사례와 DX-7 결정\"입니다. 세온 RFQ(7/31)를 언급했습니다 |\n| 문 팀장을 병목으로 표시 | 매크로를 혼자 관리하고 있습니다. \"하나만 된다면 VOC와 분기 리뷰\"라고 답했습니다 |\n\n**메인테이너 후보**\n- **★A 한경수 부장:** 도메인 지식이 가장 많습니다. 2027년 6월 정년이라 기간 리스크가 있습니다.\n- **★B 오지민 사원:** 실무와 데이터 원천을 압니다. 주니어로서 유지보수를 하며 도메인을 익힐 수 있습니다 (08-12).\n- **권고:** 오지민을 주 메인테이너로, 한경수를 지식 검토자로 둡니다. 이 구조가 12주차 이벤트(한 부장 휴직)에 대한 대비책이 됩니다.\n\n**\"왜 우리에게 맡겼나\" 메타인지 (10-05)**\n- 내부 역량은 충분합니다. 다만 영업과 상품기획 사이의 데이터 공유를 내부 사람이 꺼내기 어렵습니다(정치).\n- 팀장은 바빠서 직접 바꿀 시간이 없습니다.\n- → **FDE의 역할은 외부 드라이버로서 두 부서 사이를 중재하는 것입니다.**\n\n### 4-3. 데이터 등급표 (확정)\n\n| 데이터 | 등급 | 에이전트 투입 형태 | 소유자 | 받는 방법 |\n|---|---|---|---|---|\n| SAP 판매 실적 | 내부 | 단가 컬럼을 뺀 주간 CSV 자동 추출 | 최은재 | 월마감 기간을 피해 요청 |\n| 가격표·원가 | 대외비 A | 투입 금지. 한 부장이 마진율 결과만 제공 | 한경수 | – |\n| VOC 원본 | 내부 | **할인 문구를 마스킹한 사본** | 윤태호 | 윤 차장이 마스킹 규칙에 동의 |\n| CRM 메모 | 대외비 A | 마스킹 후 투입 | 윤태호 | 상동 |\n| 경쟁사 스펙 | 일반 | 원본 투입 | 상품기획 | – |\n| 전시회 리드 | 내부 | 원본 투입 | 배수빈 | 즉시 |\n\n**정해린 책임과 합의한 내용:** 상품기획팀 5명에게 사내 승인 에이전트를 확장합니다. 데이터 분류표를 첨부해 신청하고, 승인까지 약 1주가 걸립니다.\n", "csv": null, "cls": ""}, {"id": "w5", "group": "주차별 실습", "label": "5주차", "md": "# 5주차: 문제 정의, 난제 판별, 리서치 브리프 (SOW 합의)\n\n- **모듈:** M5\n- **근거 영상:** 10-09, 08-12, 06-11, 11-02\n- **이어받는 것:** 4주차 토폴로지 맵 v2, 인터뷰 노트, 데이터 등급표 / 3주차 아키텍처 v1 / 1주차 제안서 v0\n- **넘기는 것:** 문제 정의서 v1과 SOW(8주 실행 범위) → 6~8주차 실행과 9~12주차 캡스톤의 기준선 / 리서치 브리프의 접근 방식 → 6주차 이후 집계 기준과 암묵지 수집 범위\n\n---\n\n## A. 실습 자료\n\n### 상황\n4주차 인터뷰가 끝났습니다. 이번 주에 문서진 팀장, 강도윤 전무와 **무엇을 풀지** 합의해야 합니다.\n\n### 입력\n- 4주차 산출물 전체\n- 인터뷰에서 나온 요청 후보 6개 (아래)\n\n| # | 요청 후보 | 요청한 사람 |\n|---|---|---|\n| R1 | VOC 집계 자동화 | 문서진, 오지민 |\n| R2 | 경쟁사 비교 자동화 | 문서진 |\n| R3 | 월간·분기 리포트 자동화 | 문서진 |\n| R4 | 가격 시뮬레이션 | RFP (5주차 이벤트로 문서진이 다시 강조) |\n| R5 | DX-7(일체형) 출시 판단 근거 | 강도윤 (간접), 윤태호 |\n| R6 | 신제품 기획서 초안 | RFP |\n\n### 과제\n1. 각 후보를 **난제 판별 4문항**(10-09)으로 판정합니다.\n2. **문제 정의서 v1:**\n   - 배경\n   - 키맨별 성공 기준\n   - 범위 안과 범위 밖\n   - 기간과 중점 (확산, 실험, 완성도 중 하나)\n3. **SOW (1쪽):** 6~12주차 실행 계획, 산출물, 종료 조건.\n4. **범위 변경 이벤트 대응:** 수요일에 문 팀장이 \"가격 시뮬레이션도 이번에 꼭 넣어 주세요\"라고 요청합니다. 대응 메모를 씁니다.\n5. **리서치 브리프 (1쪽, 11-02):** 핵심 문제로 고른 후보에 대해, 구현에 들어가기 전에 접근 방식을 조사합니다.\n   - 조사 질문 3개 이내\n   - 찾은 자료: 제목, 발행처, 날짜, URL. **출처 없는 항목은 인정하지 않습니다.** AI에게 조사를 시켜도 되지만 링크를 직접 열어 확인합니다.\n   - 접근 방식 2~3안과 장단점\n   - 추천안, 그리고 실패 판단 기준과 복귀 계획\n   - 금요일에 문 팀장(강사)과 15분간 어프로치를 논의하고, 결과를 브리프 끝에 적습니다.\n\n### 제출 양식\n```\n5-1_난제판정표.md\n5-2_문제정의서_v1.md\n5-3_SOW_v1.md\n5-4_범위변경대응메모.md\n5-5_리서치브리프.md\n```\n\n### 평가 포인트\n- R1~R3을 하나의 버티컬 흐름(VOC → 월간 리포트 → 분기 결정)으로 묶었는가 (06-11).\n- R5를 \"숨은 진짜 목표\"로 식별했는가.\n- 범위 변경에 \"안 됩니다\"가 아니라 **먼저 대안을 제안**했는가 (10-09).\n- RFP의 \"에이전트 5종\"이나 \"VOC 집계 자동화\"를 그대로 구현 계획으로 옮기지 않고(**인텐트 그대로 때려박기**), 접근 방식을 먼저 비교했는가 (11-02).\n- 집계 단위를 \"건수\"가 아니라 **\"고유 회사\"**로 잡아야 한다는 점, 그러려면 회사명 별칭 처리와 VOC·CRM·전시회 리드 연결이 필요하다는 점을 짚었는가.\n\n---\n\n## B. 예상 산출물\n\n### 5-1. 난제 판정표\n\n| 후보 | ① \"와, 이게 될까?\" | ② 내부에서 AI만 돌려도 풀리나 | ③ 패턴으로 남나 | ④ 고객이 원하는 방식인가 | 판정 |\n|---|---|---|---|---|---|\n| R1 VOC 집계 | 아니오 | **부분적으로.** 규칙(암묵지)만 있으면 됨 | 예 | 예 | 단독으로는 난제가 아님 → 버티컬의 1단계로 |\n| R2 경쟁사 비교 | 아니오 | 예 | 예 | 예 | 단독으로는 난제가 아님 → 1단계에 포함 |\n| R3 리포트 | 아니오 | 부분적으로 | 예 | 예 | 버티컬의 2~3단계 |\n| R4 가격 시뮬 | 예 | 아니오. 대외비 데이터와 한 부장 판단이 필요 | 예 | **불명확.** 한 부장이 경계함 | 캡스톤 후보. 지금은 보류 |\n| **R5 DX-7 판단 근거** | **예.** 영업↔상품기획 데이터 공유와 RFQ 마감 압박 | **아니오.** 부서 간 정치 때문에 내부에서 꺼내기 어려움 | 예 (신제품 판단 패턴) | 예. 전무의 진짜 KPI | **난제 → 핵심 목표** |\n| R6 기획서 초안 | 아니오 | 예 | 예 | 부분적으로 | R5의 최종 산출물로 흡수 |\n\n### 5-2. 문제 정의서 v1\n\n- **문제 문장:** 로봇 OEM 고객의 일체형 요구 신호가 영업 채널에 흩어져 있고, 상품기획의 집계는 수작업으로 2주가 걸립니다. 그래서 본부장이 DX-7 출시를 판단할 근거가 제때 올라가지 않습니다.\n- **근거 수치 (현재까지):**\n  - 로봇 OEM 비중: DX-5 상반기 매출의 53.6%\n  - 세온 RFQ 마감: 7월 31일\n  - 아크봇 샘플 필요 시점: 8월\n\n| 키맨 | 성공 기준 |\n|---|---|\n| 강도윤 | 신제품 판단 근거가 데이터로 정리되어 정기 보고에 올라오고, 이사회에서 사례 1건을 말할 수 있다 |\n| 문서진 | 분기 리뷰 준비가 2주에서 3일 이하로 줄어든다 |\n| 오지민 | 주간 VOC 취합이 하루에서 1시간 이하로 줄어든다 |\n| 한경수 | 본인의 판단 기준이 \"상황과 함께\" 기록된다 |\n| 윤태호 | 할인 정보 노출 없이 VOC를 제공하고, 로봇 OEM 대응 속도가 빨라진다 |\n\n- **범위 안:** VOC 정제 → 월간 시장·VOC 리포트 → 분기 포트폴리오 의사결정 메모로 이어지는 버티컬 1개. 컨텍스트 그래프. 메인테이너 양성.\n- **범위 밖:** 업무별 개별 에이전트, 대시보드 개발, 가격 결정 자동화.\n- **기간과 중점:** 실행 8주(6~12주차). 중점은 **완성도**입니다. 이사회 보고에 쓸 수준이어야 하기 때문입니다.\n\n### 5-3. SOW v1 (요지)\n\n| 주 | 활동 | 산출물 |\n|---|---|---|\n| 6 | 에이전틱 워크 시작, 암묵지 수집 | 컨텍스트 그래프 v1 |\n| 7 | 버티컬 데모, 평가 | 데모, 평가 리포트 |\n| 8 | 메인테이너 양성 착수 | 인수 패키지 v1 |\n| 9~12 | 실전 운영, DX-7 판단 자료, 인수 완료 | 최종 보고, 인수 완료 확인서 |\n\n**종료 조건 (필수):** 오지민 사원이 FDE 없이 ① 월간 리포트 1회 생성 ② 지식 PR 1건 처리.\n\n### 5-4. 범위 변경 대응 메모 (문 팀장에게)\n\n> 팀장님, 가격 시뮬레이션의 필요성에 공감합니다. 다만 가격은 대외비 A 데이터이고, 한 부장님의 판단 기준 정리가 먼저 필요합니다. 그래서 이렇게 제안드립니다.\n>\n> 1. 6주차 암묵지 수집 때 한 부장님의 가격 기준(마진 하한, 할인 한도)을 먼저 정리합니다.\n> 2. 캡스톤(9~12주차)에서 DX-7 출시 판단 자료에 \"가격 포지셔닝 1쪽\"을 넣습니다.\n> 3. 시뮬레이션 자체는 집계 결과만 써서 한 부장님 검토를 거치는 방식으로 합니다.\n>\n> 이렇게 하면 이번 범위 안에서 가격 판단의 근거는 확보되고, 대외비 데이터 이슈도 피할 수 있습니다.\n\n### 5-5. 리서치 브리프 (모범)\n\n> 아래 \"찾은 자료\" 칸은 형식 예시입니다. 실제 수업에서는 수강생이 직접 찾아 확인한 자료(제목·발행처·날짜·URL)로 채워야 하며, 강사는 링크를 열어 확인합니다. 모범 답안의 평가 대상은 **질문의 질, 대안 비교, 복귀 계획**입니다.\n\n**대상 문제:** R5 DX-7 판단 근거 (R1~R3 버티컬 포함)\n\n**조사 질문**\n1. 짧고 지저분한 B2B VOC(56행)를 요구 유형으로 분류할 때, 지금 쓰이는 방법은 무엇이고 사람이 얼마나 검토해야 하나?\n2. 같은 회사가 다른 이름으로 적힌 데이터(VOC, CRM 메모, 전시회 리드)를 하나의 회사로 묶는 방법은?\n3. 신제품 출시 판단 자료는 보통 어떤 항목(수요 근거, Go 조건, No-go 조건)으로 구성하나?\n\n**찾은 자료** (형식 예시)\n\n| # | 자료 | 발행처·날짜 | 핵심 내용 | 신뢰도 |\n|---|---|---|---|---|\n| 1 | (LLM 기반 텍스트 분류 + 사람 검토 사례) | 게 달라졌는지 기록합니다.\n4. **지식 PR 템플릿:** 규칙이 바뀔 때 메인테이너가 올릴 양식을 만듭니다.\n\n### 제출 양식\n```\n6-1_컨텍스트그래프_v1.yaml (또는 .csv)\n6-2_충돌해결기록.md\n6-3_스킬_v1/ (변경 diff 포함)\n6-4_재실행결과.md\n6-5_지식PR템플릿.md\n```\n\n### 평가 포인트\n- K1~K12 중 10개 이상을 찾았는가.\n- 충돌 1(할인 한도)에서 12%를 \"폐기된 기준\"으로 판정했는가. 한 부장 인터뷰에 근거가 있습니다.\n- K9(로봇 3사 가중치)를 문서 근거가 없는 지식으로 보고 **확인 질문**을 만들었는가.\n- 재실행 결과가 정답 키와 맞는가: 중복 제거 후 37건, 리포트 포함 28건, 가중 1위 신규요구(14).\n\n---\n\n## B. 예상 산출물\n\n### 6-1. 컨텍스트 그래프 v1 (발췌)\n\n```yaml\n# knowledge/context_graph.yaml  (v1, 2026-W6)\n- id: K3\n  rule: \"납기 관련 VOC는 상품기획 리포트에서 제외하고 SCM 전달 리스트로 분리한다\"\n  speaker: 문서진\n  dept: 상품기획\n  role: 팀장\n  context: [VOC집계, 월간리포트]\n  source: prompt_log 07-06 09:40\n  confidence: high\n  expires: null\n\n- id: K8\n  rule: \"동일 고객의 동일 이슈 반복 제기(채널 무관)는 1건으로 센다\"\n  speaker: 문서진\n  dept: 상품기획\n  role: 팀장\n  context: [VOC집계]\n  source: prompt_log 07-06 10:20 (매크로 v7 규칙과 일치)\n  confidence: high\n\n- id: K9\n  rule: \"로봇 OEM 3사(누리로보틱스, 세온, 아크봇) 요청은 가중치 2배\"\n  speaker: 강도윤 (문서진 전언)\n  dept: 본부\n  role: 전무\n  context: [VOC집계, 분기리뷰]\n  source: prompt_log 07-06 10:46 \"문서로는 없어\"\n  confidence: medium        # 문서 근거 없음 → 확인 질문 발송\n  expires: \"2026-12-31\"     # 전무 확인 후 기입\n\n- id: K2-current\n  rule: \"신규 고객 첫 견적 할인 승인 상한 15%\"\n  speaker: 한경수\n  dept: 상품기획\n  role: 부장\n  context: [특판가, 견적]\n  source: interview_han Q2\n  confidence: high\n  supersedes: K2-legacy\n\n- id: K2-legacy\n  rule: \"신규 고객 첫 견적 할인 12%\"\n  status: deprecated(2024)\n  note: \"영업에서 아직 사용 중 → 영업 교육 액션아이템\"\n\n- id: K2-robot\n  rule: \"로봇 OEM은 LOI가 있고 전무가 승인한 경우 최대 20%\"\n  speaker: 한경수\n  context: [특판가, 로봇OEM]\n  condition: [LOI, 전무승인]\n\n- id: K5\n  term: 수요\n  definitions:\n    - {scope: 영업,     meaning: \"견적 요청 수량\"}\n    - {scope: 상품기획, meaning: \"수주 확정 수량\"}\n  rule: \"리포트에 '수요'를 쓸 때는 정의 출처를 표기한다\"\n```\n\n**추출된 암묵지 전체:** K1~K12. 출처 분포는 다음과 같습니다.\n- 프롬프트 로그: K3, K4, K5, K6, K8, K9, K10, K12\n- 인터뷰: K1, K2, K5, K7, K11\n\n### 6-2. 충돌 해결 기록\n\n| 충돌 | ① 팩트 오류인가 | ② 맥락으로 구분되나 | ③ 조직문화 확인 |  절반이 지났습니다. 지금부터 **FDE가 빠져도 돌아가는 구조**를 설계합니다. 1인 FDE는 팀원이 없습니다. 그래서 부담을 나눌 구조도 이번 주에 함께 설계합니다.\n\n### 과제\n1. **인수 패키지 v1**\n   - 운영 매뉴얼 (주간과 월간 실행 순서)\n   - 컨텍스트 그래프 관리 가이드\n   - 지식 PR 검토 절차\n   - 30일 동행 계획\n2. **메인테이너 역할 설계:** 오지민(주 메인테이너)과 한경수(지식 검토자)의 역할, 권한, 시간 배분을 정합니다.\n3. **내재화 조항:** SOW에 추가할 조항 문구를 씁니다.\n4. **1인 FDE 부담 관리 계획:** 07-14 영상의 자가진단과 \"부담은 혼자 지지 않는다\"를 1인 상황에 맞게 적용합니다.\n\n### 제출 양식\n```\n8-1_인수패키지_v1/ (runbook.md, graph_guide.md, pr_process.md, 30day_plan.md)\n8-2_메인테이너역할표.md\n8-3_내재화조항.md\n8-4_부담관리계획.md\n```\n\n### 평가 포인트\n- 메인테이너가 **혼자서** 할 수 있는 일과 승인이 필요한 일이 구분되어 있는가.\n- 한 부장 퇴직(2027년 6월)에 대한 대비가 있는가. 12주차 이벤트를 미리 대비합니다.\n- 1인 FDE인데도 부담을 나눌 구조(멘토, 고객 측 카운터파트, 공유 리듬)가 있는가.\n\n---\n\n## B. 예상 산출물\n\n### 8-1. 운영 매뉴얼 (runbook.md 요지)\n\n| 주기 | 순서 | 담당 | 소요 |\n|---|---|---|---|\n| 매주 월 | SAP 주간 CSV 수신 → `voc_clean` → `lead_filter` → `competitor_table` 실행 → 결과 검수 | 오지민 | 1시간 |\n| 매월 8영업일 | SAP 마감 확인(K10) → `monthly_report` → 팀장 검토 | 오지민 → 문서진 | 반나절 |\n| 분기 | `quarterly_memo` → 한 부장 도메인 검토 → 팀장 승인 → 전무 보고 | 오지민 → 한경수 → 문서진 | 2일 |\n| 수시 | 규칙 변경 → 지식 PR → 평가셋 재실행 → 승인 | 오지민 | 건당 1시간 |\n\n### 8-2. 메인테이너 역할표\n\n| 할 일 | 오지민 (주 메인테이너) | 한경수 (지식 검토자) | 문서진 (승인자) |\n|---|---|---|---|\n| 정기 실행과 검수 | ● 단독 | | |\n| 별칭 사전, 분류 목록 수정 | ● 단독 (PR 기록) | | 사후 확인 |\n| 가격, 단종 기준(K1, K2, K11) 변경 | PR 작성 | ● 검토 필수 | ● 승인 |\n| 보고 형식(K4) 변경 | PR 작성 | | ● 승인 |\n| 시간 배분 | 주 4시간 (공식 업무로 지정) | 월 2시간 | 월 1시간 |\n\n**한 부장 퇴직 대비 (04-02, 08-12):** 9~12주차에 한 부장이 K1, K7, K11을 판단한 실제 사례 3건을 **\"상황 + 판단 + 이유\"** 형식으로 컨텍스트 그래프에 기록합니다. 판단 규칙만 적지 않고 상황과 함께 남기는 것입니다. 한 부장이 \"기계적으로 쓸까 봐 안 적었다\"는 우려를 해소하는 장치입니다.\n\n### 8-3. 내재화 조항 (SOW 추가 문구)\n\n> 제7조 (내재화)\n> ① 수행사는 고객사가 지정한 메인테이너(오지민)가 다음을 수행할 수 있도록 교육하고 동행한다.\n>    가. 월간 리포트를 단독으로 생성\n>    나. 지식 PR 1건을 단독으로 작성하고 처리\n> ② 프로젝트 종료 요건은 제1항 가와 나를 고객사 승인자(문서진)가 확인하는 것으로 한다.\n> ③ 모든 지침, 스킬, 컨텍스트 그래프의 소유권은 고객사에 있다. 이는 특정 AI 제품에 종속되지 않는 텍스트 형식으로 인도한다.\n\n### 8-4. 1인 FDE 부담 관리 계획\n\n화자는 FDE 솔로 프로젝트를 지양하라고 했습니다 (07-14, 08-12). 그래서 1인 FDE는 **팀이 없는 대신 아래 구조로 부담을 나눕니다.**\n\n| 장치 | 내용 |\n|---|---|\n| 고객 측 카운터파트 | 오지민 사원이 매일 15분 동기화합니다. 같은 맥락을 가진 사람이 고객사에 한 명 있게 하는 장치이자 메인테이너 양성 과정입니다 |\n| 외부 멘토 | 주 1회 30분 리뷰합니다. 토폴로지 맵, 리스크, 막힌 지점을 다룹니다 |\n| 에이전트 운영 원칙 | 동시 세션 3개 이하. 자율 실행은 1시간 이하 단위. 야간 무인 실행 금지 (07-14) |\n| 진행 공유 | 매주 금요일 문 팀장에게 1쪽 공유: 에이전트 운영 현황, 검수 방식, 다음 주 리스크 |\n| 자가진단 (주 1회) | 노트북을 닫을 때 죄책감이 드는가 / 쉬는 중에도 에이전트를 확인하는가 / \"이것만 끝나면\"이 3주 넘게 반복되는가 → 2개 이상이면 멘토와 범위를 다시 조정 |\n", "csv": null, "cls": ""}, {"id": "w9", "group": "캡스톤 (혼자 수행)", "label": "9주차", "md": "# 9주차 (캡스톤 1/4): 실전 투입, 환경 이전과 판단 사례 수집\n\n- **캡스톤 규칙:** 9~12주차는 수강생 1명이 FDE로 혼자 수행합니다. 강사는 고객 역할만 맡고 코칭하지 않습니다. 외부 멘토 리뷰는 주 1회(8주차 계획대로) 허용합니다.\n- **이어받는 것:** 1~8주차 산출물 전부 (특히 인수 패키지 v1, 워크플로 v1, 컨텍스트 그래프 v1)\n- **넘기는 것:** 고객 환경에서 돌아가는 워크플로 v2, 판단 사례 3건 → 10~12주차\n\n---\n\n## A. 실습 자료\n\n### 과제\n1. **환경 이전:** 개인 실습 환경에 있던 지침, 스킬, 컨텍스트 그래프를 고객사의 사내 승인 에이전트 환경으로 옮깁니다. 이전 체크리스트를 작성합니다.\n2. **윤태호 차장과 VOC 마스킹 합의서:** 할인 문구를 가리는 규칙을 정하고, 윤 차장의 서명을 받는 형식으로 문서화합니다.\n3. **한경수 부장 판단 사례 3건 기록 (\"상황 + 판단 + 이유\"):** 그중 1건은 아래 실제 요청으로 합니다.\n   > 성우자동화가 DS3-100 특판가를 요청했습니다. Zhenli ZL-100이 245천 원에 들어오고 있고, 대리점 재고는 340대입니다.\n4. **오지민 사원 첫 단독 주간 실행:** FDE는 옆에서 관찰만 합니다. 막힌 지점을 기록합니다.\n\n### 제출 양식\n```\n9-1_환경이전체크리스트.md\n9-2_VOC마스킹합의서.md\n9-3_판단사례_3건.md\n9-4_오지민_첫실행관찰.md\n```\n\n---\n\n## B. 예상 산출물\n\n### 9-1. 환경 이전 체크리스트 (모범)\n- [ ] 정해린 책임의 확장 승인서 수령 (상품기획팀 5명)\n- [ ] 대외비 A 파일 읽기 금지 규칙이 고객 환경에서도 동작하는지 테스트 (7주차 사고의 재발 방지)\n- [ ] SAP 주간 CSV(단가 제외) 자동 수신 경로 확인 (최은재 차장, 월마감 기간 회피)\n- [ ] 평가셋 30문항을 고객 환경에서 재실행: 개인 환경과 같은 결과가 나오는지 확인\n- [ ] 모든 산출물 경로를 고객사 공유 폴더로 변경. FDE 개인 계정 의존 0건\n\n### 9-2. VOC 마스킹 합의서 (요지)\n\n| 원본 표현 예 | 처리 |\n|---|---|\n| \"단가 20% 할인 요청\", \"특판가 15%\" | `[할인조건]`으로 치환 |\n| 구체 금액 (예: \"245에 들어옴\") | 경쟁사 가격은 유지 (공개 정보). 자사 견적가는 `[자사가격]` |\n| 고객 요구 사항, 제품 이슈 | 원문 유지 |\n\n- **윤 차장이 얻는 것:** 할인 조건이 상품기획에 노출되지 않습니다. 로봇 OEM 요구가 분기 보고에 공식 반영됩니다.\n\n### 9-3. 판단 사례 1: DS3-100 특판가 (모범)\n\n> 이 계산은 대외비 A인 가격 데이터를 쓰므로 **한 부장이 사내 문서에서 직접 수행**합니다. 에이전트에는 결과만 기록합니다.\n\n- **상황:** Zhenli ZL-100은 245천 원으로 DS3-100 표준가(380천 원)보다 35.5% 쌉니다. 대리점 재고는 340대입니다. DS3-100은 7주차 메모에서 단종 검토 대상으로 분류되었습니다.\n- **판단:** 가격 인하로는 대응하지 않습니다. TCO 비교 자료로 대응하고, 재고는 단종 검토 일정과 연계해 소진합니다.\n- **이유 (한 부장)**\n  - 대리점 마진 18%(K1)를 지키면서 판매가를 300천 원까지 내리면, 우리 공급가가 원가 아래로 떨어집니다. 판매가 320천 원에서도 우리 마진이 거의 0입니다.\n  - 가격으로 싸우면 진다는 원칙(K12)에 따라 수명, 튜닝 시간, AS를 포함한 총비용으로 이야기합니다.\n- **기록 형식:**\n  ```yaml\n  case_id: C1\n  links: [K1, K11, K12]\n  situation: ...\n  decision: ...\n  reason: ...\n  decided_by: 한경수\n  date: 2026-W9\n  ```\n\n**나머지 2건 (예시):**\n- **C2:** 경쟁사 신제품 비교에서 데이터시트가 없을 때의 처리. MR-H70J는 결론을 보류하고 \"구두 확인\" 표기를 합니다 (K7).\n- **C3:** 로봇 OEM 20% 할인 승인 조건 검토. 누리로보틱스 LOI 건으로, LOI 문서 확인과 전무 승인 경로를 기록합니다 (K2-robot).\n\n### 9-4. 오지민 첫 단독 실행 관찰 (모범)\n\n| 막힌 지점 | 원인 | 조치 |\n|---|---|---|\n| 새 별칭 \"케이로보\"가 정규화되지 않음 | 별칭 사전에 없음 | 지식 PR 연습 과제로 지정 (12주차 인수 확인에 사용) |\n| 마스킹된 VOC에서 `[할인조건]`만 남은 행의 분류 | 규칙 없음 | \"할인조건만 있는 행은 가격 분류\" 규칙을 PR 후보로 등록 |\n| 소요 시간 | – | 1시간 20분. 목표 1시간에 근접 |\n", "csv": null, "cls": ""}, {"id": "w10", "group": "캡스톤 (혼자 수행)", "label": "10주차", "md": "# 10주차 (캡스톤 2/4): 지식 충돌 재연과 첫 월간 리포트\n\n- **이어받는 것:** 9주차 고객 환경 워크플로 v2, VOC 마스킹 합의, 6주차 충돌 해결 기록\n- **넘기는 것:** 부서 간 숫자 대사표, 7월 월간 리포트 → 11주차 DX-7 판단 자료의 수요 근거\n\n---\n\n## A. 실습 자료\n\n### 이벤트\n월요일 본부 회의에서 숫자가 맞지 않습니다.\n- **윤태호 차장 (영업):** \"일체형 원하는 고객이 7곳이고 수요가 2,400대 넘습니다.\"\n- **문서진 팀장 (상품기획):** \"VOC상 신규요구는 4개 회사, 8건입니다.\"\n- **강 전무:** \"누구 숫자가 맞습니까?\"\n\n### 과제\n1. **숫자 대사표:** 두 숫자가 각각 무엇을 셌는지 분해하고, 하나의 통합 뷰를 제시합니다.\n2. 이 충돌을 **지식 PR**로 만들어 컨텍스트 그래프에 반영합니다.\n3. **7월 월간 리포트:** 오지민이 생성하고 FDE가 검토합니다. 리포트에 대사 결과를 반영합니다.\n\n### 제출 양식\n```\n10-1_숫자대사표.md\n10-2_지식PR_수요집계기준.md\n10-3_7월월간리포트.md (+ 검토 코멘트)\n```\n\n### 평가 포인트\n- \"2,400대\"가 **DX5-750 LOI 견적 기준 수량**이라서 일체형 수요가 아니라는 점을 잡아냈는가. 이것이 함정입니다.\n- 7곳과 4곳이 **집계 범위의 차이**(VOC만 vs VOC + 전시회 리드)라는 점을 데이터로 보였는가.\n\n---\n\n## B. 예상 산출물\n\n### 10-1. 숫자 대사표 (모범)\n\n| 숫자 | 출처 | 실제 의미 | 판정 |\n|---|---|---|---|\n| 영업 \"7곳\" | VOC + 전시회 유효 리드 (견적·샘플) | 일체형에 관심을 보인 고유 회사 수 | 맞음 (범위가 넓음) |\n| 상품기획 \"4개 회사, 8건\" | VOC만 (K8 중복 제거) | 신규요구 VOC를 낸 고유 회사 수 | 맞음 (범위가 좁음) |\n| 영업 \"2,400대\" | 누리로보틱스 CRM 메모 (04-15) | **DX5-750** 연간 LOI 가능 수량. 견적 기준(K5 영업 정의) | **일체형 수요가 아님.** DX-7 근거에서 제외 |\n\n**고유 회사 분해**\n\n| 회사 | VOC 신규요구 | 전시회 유효 리드 (일체형) | 로봇 3사 |\n|---|---|---|---|\n| 아크봇 | 3건 | 견적요청 | ● |\n| 누리로보틱스 | 2건 | – (방문만, 제외) | ● |\n| 그린텍 | 2건 | – | |\n| 세온 | 1건 | 샘플요청 | ● |\n| 케이로보 | – | 샘플요청 | |\n| 디에스메디칼 | – | 견적요청 | |\n| 바른로봇 | – | 샘플요청 | |\n| **합계** | **4개사** | **5개사** | **3개사 전부 포함** |\n\n**통합 뷰 (본부 회의 보고용):** 일체형 관심 고객은 7개사입니다. 그중 로봇 3사가 모두 포함되어 있습니다. 확정 수요(수주)는 아직 0입니다. 2,400대는 DX5-750 건이므로 별도로 봐야 합니다.\n\n### 10-2. 지식 PR: 수요 집계 기준 (모범)\n```markdown\n## 지식 PR: K5-a 신제품 관심 고객 집계 기준 (신규)\n- 변경 종류: 신규\n- 변경 후: \"신제품 관심 고객\"은 VOC 신규요구 + 전시회 유효 리드(K6)의 고유 회사 수로 센다.\n  수량은 영업 정의(견적)와 상품기획 정의(수주)를 분리 표기한다.\n  제품 모델이 다른 수량(예: DX5-750 LOI)은 합산하지 않는다.\n- 이유: 2026-W10 본부 회의 숫자 불일치 (영업 7곳 vs 상품기획 4곳, 2,400대 모델 혼동)\n- 영향: monthly_report, quarterly_memo\n- 테스트: 평가셋에 문항 31 추가 (\"일체형 관심 고객 수\" → 7, \"2,400대는 일체형 수요인가\" → 아니오)\n- 검토자: 한경수(도메인), 문서진(승인)\n```\n\n### 10-3. 7월 월간 리포트 검토 코멘트 (FDE → 오지민, 예시)\n- ✅ 납기와 품질을 분리한 것, 출처 표기, 잠정·확정 표기(K10)가 모두 맞습니다.\n- ⚠ 표가 3개입니다. 팀장용이라 괜찮지만, 전무용 요약은 1장으로 줄여 주세요 (K4).\n- ⚠ \"고객들이 일체형을 원한다\"는 일반론 문장을 빼고, 위 대사표의 7/4/3 숫자로 바꿔 주세요 (워크슬롭 방지, 04-21).\n", "csv": null, "cls": ""}, {"id": "w11", "group": "캡스톤 (혼자 수행)", "label": "11주차", "md": "# 11주차 (캡스톤 3/4): 성공 기준 변경, DX-7 Go/No-go 근거 자료\n\n- **이어받는 것:** 7주차 분기 메모와 평가셋, 10주차 숫자 대사표, 9주차 판단 사례, 5주차 범위 변경 메모(가격 포지셔닝 약속)\n- **넘기는 것:** DX-7 판단 근거 패키지, `go_nogo_memo`와 `prd_draft` 스킬 → 12주차 최종 보고, 메인테이너 인수\n\n---\n\n## A. 실습 자료\n\n### 이벤트\n화요일에 강 전무가 연락합니다.\n> \"월간 리포트 자동화는 좋습니다. 그런데 이사회 전에 제가 정말 필요한 건 **DX-7을 할지 말지 판단할 근거**입니다. 8월 첫째 주까지 가능합니까?\"\n\n### 과제\n0. **어프로치 메모 (반 쪽, 11-02):** 바로 `go_nogo_memo` 스킬을 만들지 않습니다. 신제품 출시 판단 자료를 어떤 구성으로 만들지 2~3안을 조사·비교하고, 화요일 오후 전무와 10분 통화로 하나를 정합니다. 5주차 리서치 브리프와 같은 규칙(출처 필수, 실패 시 복귀 계획)을 적용합니다.\n1. **범위 변경 대응:** 남은 기간(11~12주차)과 인수 일정을 지키면서 수용하는 계획을 씁니다.\n2. **DX-7 Go/No-go 근거 자료 (본문 1쪽 + 부록):** FDE는 결정하지 않습니다. 결정에 필요한 근거와 미확인 사항을 정리합니다.\n3. **가격 포지셔닝 1쪽:** 5주차에 약속한 것입니다. 경쟁 제품 가격 범위와 원가 확인 필요 항목을 정리합니다.\n4. **스킬 추가:** `go_nogo_memo`와 `prd_draft`를 기존 버티컬에 연결합니다. 새 에이전트는 만들지 않습니다.\n\n### 제출 양식\n```\n11-0_어프로치메모.md\n11-1_범위변경계획.md\n11-2_DX7_GoNogo_근거.md\n11-3_가격포지셔닝.md\n11-4_스킬추가_diff.md\n```\n\n### 평가 포인트\n- FDE가 결론(\"하자\")을 내리지 않고 **판단 근거와 결정 항목**을 제시했는가.\n- 확인된 사실과 미확인 사항(개발 기간, 원가, MR-H70J 실측)을 구분했는가.\n- B2 실패라는 전무의 트라우마를 반영해 **No-go 조건도 같이** 제시했는가.\n- 요청을 받자마자 스킬부터 만들지 않고, **자료 구성 방식을 먼저 전무와 합의**했는가 (11-02).\n\n---\n\n## B. 예상 산출물\n\n### 11-0. 어프로치 메모 (모범)\n\n| 안 | 구성 | 판단 |\n|---|---|---|\n| A. 요청 그대로 | 월간 리포트에 \"DX-7 수요\" 장을 추가해 숫자 요약 | 빠르지만 결정 항목이 없음. B2처럼 \"수요가 있어 보인다\"로 끝날 위험 |\n| **B. 조건표 방식** | 결정 항목마다 Go 조건, No-go 신호, 현재 근거, 미확인 사항을 나란히 정리 (신제품 게이트 심사 방식의 기준 구성을 참고) | 전무가 \"무엇이 확인되면 하는가\"를 바로 볼 수 있음. **추천** |\n| C. 시나리오 방식 | 수요(낙관·기준·비관) × 원가 시나리오별 손익 | 원가가 미확인이라 지금은 숫자가 비어 있음. B의 부록으로만 |\n\n- **통화 결과:** 전무가 B를 선택. \"이사회에는 1쪽, 부록은 필요할 때만.\" → 11-2의 형식이 여기서 정해짐.\n- **복귀 계획:** R&D 회신이 수요일까지 오지 않으면 개발 기간 항목은 \"미확인\"으로 두고 일정대로 제출. 시나리오(C)는 원가 확인 후 12주차 부록으로.\n- 출처 칸은 수강생이 직접 확인한 자료로 채웁니다 (5주차와 같은 규칙).\n\n### 11-1. 범위 변경 계획 (모범)\n- **수용합니다.** 새로 만들 것은 거의 없습니다. 기존 버티컬의 L3 단계에 `go_nogo_memo` 스킬 하나만 추가합니다. 근거 데이터는 이미 6~10주차에 정제되어 있습니다.\n- **인수 일정은 지킵니다.** 12주차 오지민 단독 실행 확인은 그대로 둡니다. Go/No-go 자료 작성에 오지민을 참여시켜 인수 교육을 겸합니다.\n- **새로 필요한 정보 (요청 대상)**\n\n  | 정보 | 요청 대상 | 시점 |\n  |---|---|---|\n  | DX-7 개발 기간과 비용 추정 | R&D | 수요일 |\n  | 목표 원가 | 한 부장. 대외비이므로 결과만 받음 | – |\n  | 세온 RFQ 요구 스펙 | 윤 차장 | – |\n\n### 11-2. DX-7 Go/No-go 근거 자료 (본문 모범 답안)\n\n> **DX-7(일체형 중공축 액추에이터) 개발 착수 판단 근거** (2026-08-03)\n>\n> **판단 요청:** 개발 착수 여부. 이 자료는 근거를 정리한 것이며 권고안을 포함하지 않습니다.\n>\n> **확인된 근거**\n> 1. **고객 관심:** 일체형 관심 고객 7개사. 로봇 3사(누리로보틱스, 세온, 아크봇)가 모두 포함됩니다. 확정 수주는 0건입니다 (10주차 대사 기준).\n> 2. **시간 제약:** 세온은 7월 31일 마감된 RFQ에 일체형 로드맵을 공유하는 조건으로 대응했습니다. 공급사 선정 일정은 윤 차장이 확인 중입니다. 아크봇은 8월 샘플이 필요하고, 9월에 시제품을 만듭니다.\n> 3. **경쟁:** 미라텍 MR-H70J(2026년 5월 공개, 1,650천 원), Kestrel KM-J80(2,100천 원). 자사 일체형 제품은 없습니다.\n> 4. **기존 강점:** 750W 단품 연속 토크는 대성 2.39로 미라텍 2.25(카탈로그)와 동등 이상입니다. DX-5 매출이 성장 중입니다(2분기 +28.8%).\n>\n> **미확인 사항 (결정 전 확인 필요)**\n> - 개발 기간과 비용 (R&D 회신 대기). 아크봇 8월 샘플 일정을 맞출 수 있는지\n> - 목표 원가와 마진 (한 부장 검토)\n> - MR-H70J 연속 토크 실측값 (현재 구두 확인 2.10)\n>\n> **Go 조건 (예시):** 로봇 3사 중 1곳 이상과 샘플 평가 합의 + R&D 개발 기간 12개월 이내 + 목표 마진 30% 이상\n> **No-go 신호 (B2의 교훈):** 확정 수요 없이 가격만으로 경쟁해야 하는 구조, 또는 원가가 경쟁사 가격대를 넘는 경우\n>\n> 부록: VOC·리드 상세, 경쟁 스펙, 산정 기준 (K5-a, K6, K7, K9)\n\n### 11-3. 가격 포지셔닝 (모범 요지)\n\n| 제품 | 가격 (천원) | 비고 |\n|---|---|---|\n| 미라텍 MR-H70J | 1,650 | 브로셔 기준 |\n| Kestrel KM-J80 | 2,100 | 환율 1,450원 기준 |\n| **DX-7 가설 범위** | **1,650 ~ 2,100 사이** | 원가 미확인. 한 부장 검토 후 확정 |\n\n- **확인 항목:** 목표 원가에서 마진 30% 이상이 나오는지. 로봇 OEM 20% 할인(K2-robot)을 적용해도 마진이 유지되는지.\n\n### 11-4. 스킬 추가 (diff 요지)\n```diff\n  quarterly_memo (K1,K4,K11)\n+ go_nogo_memo  (입력: monthly_report, 대사표, competitor_table, R&D 회신)\n+               (규칙: 권고 금지, 확인/미확인 분리, Go 조건과 No-go 신호 병기, K4 형식)\n+ prd_draft     (입력: go_nogo_memo, VOC 신규요구 원문)\n+               (출력: DX-7 기획서 골격. 고객 요구 스펙: 외경 80mm 이하, 중공축, 엔코더 배선 중공 통과)\n```\n", "csv": null, "cls": ""}, {"id": "w12", "group": "캡스톤 (혼자 수행)", "label": "12주차", "md": "# 12주차 (캡스톤 4/4): 메인테이너 재선정, 인수 완료, 퇴장\n\n- **이어받는 것:** 8주차 인수 패키지 v1과 역할표, 9주차 판단 사례 3건, 9주차 오지민 관찰 기록(PR 후보), 11주차 산출물\n- **넘기는 것:** (고객사에) 인수 완료된 운영 체계. (수강생에게) 1인 FDE 투입 준비도 평가\n\n---\n\n## A. 실습 자료\n\n### 이벤트\n월요일에 한경수 부장이 건강 문제로 2개월 휴직합니다. 지식 검토자가 비었습니다.\n\n### 과제\n1. **메인테이너 체계 재편:** 지식 검토자 공백을 메우는 방안을 토폴로지 맵을 보며 고객사와 결정합니다 (10-05).\n2. **인수 완료 확인:** 오지민이 FDE 없이 다음 두 가지를 수행합니다.\n   - ① 지식 PR 1건 처리: 9주차에 발견한 \"케이로보\" 별칭 추가, 또는 3주차 시나리오인 \"안전·인증\" 분류 추가\n   - ② 8월 월간 리포트 생성\n3. **최종 보고 (강 전무, 1쪽):** 이사회에서 쓸 수 있는 사례 형식으로 씁니다.\n4. **퇴장 회고와 1인 FDE 준비도 자가평가:** `instructor/solo_fde_readiness.md`를 사용합니다.\n\n### 제출 양식\n```\n12-1_메인테이너재편안.md\n12-2_인수완료확인서.md\n12-3_최종보고.md\n12-4_회고_준비도자가평가.md\n```\n\n---\n\n## B. 예상 산출물\n\n### 12-1. 메인테이너 재편안 (모범)\n\n| 역할 | 기존 | 재편 (한 부장 휴직 기간) |\n|---|---|---|\n| 주 메인테이너 | 오지민 | 오지민 (변경 없음) |\n| 지식 검토자 | 한경수 | **문서진 팀장이 임시 검토**. 가격·단종 규칙(K1, K2, K11) 변경은 휴직 기간 동안 **동결** |\n| 판단 근거 | 한 부장 본인 | 9주차에 기록한 **판단 사례 C1~C3**를 검토 기준으로 사용 |\n\n- **복귀 후 계획:** 한 부장이 동결 기간에 쌓인 PR을 일괄 검토합니다. 2027년 6월 정년 전까지 판단 사례를 10건으로 늘립니다.\n- **교훈:** 8주차에 \"규칙만이 아니라 상황 + 판단 + 이유\"로 기록해 둔 덕분에 공백이 생겨도 체계가 멈추지 않았습니다.\n\n### 12-2. 인수 완료 확인서 (모범)\n\n| 확인 항목 | 결과 | 확인자 |\n|---|---|---|\n| 지식 PR 단독 처리: \"케이로보\" 별칭 추가 + 평가셋 재실행 31/31 | 완료 | 문서진 |\n| 8월 월간 리포트 단독 생성 (소요 3시간, FDE 개입 0회) | 완료 | 문서진 |\n| 고객 환경에서 FDE 개인 계정 의존 항목 | 0건 | 정해린 |\n| 지침·스킬·그래프 소유권 이전 | 완료 | 문서진 |\n\n### 12-3. 최종 보고 (강 전무, 모범 요지)\n\n> **상품기획 의사결정 가속 프로젝트 결과** (12주)\n>\n> **결론:** 분기 포트폴리오 리뷰 준비가 2주에서 2일로 줄었습니다. DX-7 판단 근거를 아크봇 샘플 일정(8월) 전에 제출했습니다. 운영은 상품기획팀이 자체적으로 합니다.\n>\n> | 지표 | 이전 | 이후 |\n> |---|---|---|\n> | 주간 VOC 취합 | 1일 | 1시간 |\n> | 분기 리뷰 준비 | 2주 | 2일 |\n> | 부서 간 숫자 불일치 | 회의마다 | 정의 출처 표기로 해소 (K5, K5-a) |\n>\n> **이사회용 한 문장:** 영업 현장에 흩어진 고객 신호를 매주 자동으로 모아, 신제품(DX-7) 판단 근거를 고객 일정에 맞춰 올렸습니다.\n>\n> **남은 과제**\n> - DX-7 미확인 사항(개발 기간, 원가)의 회신\n> - 영업에 할인 기준 15% 공지 (K2)\n> - 로봇 3사 가중치 만료일(2026년 말)에 재검토\n\n### 12-4. 회고 (모범 요지)\n- **잘된 것**\n  - 4주차에 윤태호 차장을 발견한 것. 이후 모든 VOC 흐름이 여기서 열렸습니다.\n  - 6주차 K9 확인 질문. 이 하나가 우선순위를 바꿨습니다.\n  - 8주차 판단 사례 기록. 12주차 공백을 막았습니다.\n- **아쉬운 것**\n  - 7주차 보안 사고. 3주차 등급표를 스킬에 강제하지 않았기 때문입니다.\n  - 가격 포지셔닝이 원가 미확인으로 가설에 머물렀습니다.\n- **다음 FDE 프로젝트에 가져갈 패턴 (10-09: 제품이 아니라 패턴)**\n  1. 진입 첫 주에 데이터 등급표와 승인 도구를 확인합니다.\n  2. 암묵지는 \"지시 로그 1주일\"로 수집합니다.\n  3. 버티컬 3단계로 설계합니다.\n  4. 판단 사례는 \"상황 + 판단 + 이유\"로 기록합니다.\n  5. 메인테이너는 주니어 1명 + 검토자 1명으로 둡니다.\n", "csv": null, "cls": ""}, {"id": "secrets", "group": "강사 전용", "label": "숨은 정보·이벤트·정답", "md": "# 강사용: 케이스 숨은 정보, 롤플레이 대본, 이벤트\n\n> **수강생 비공개 자료입니다.** 12주 동안 모든 주차가 이 설정을 공유합니다.\n> 이 문서와 어긋나는 답을 하지 않도록 롤플레이 전에 반드시 읽으세요.\n\n---\n\n## 1. 진짜 문제 (수강생이 4~5주차에 찾아내야 할 것)\n\nRFP는 \"에이전트 5종 구축\"을 요청합니다. 하지만 실제 문제는 다음과 같습니다.\n\n1. **DX-7 출시 결정이 늦어지고 있습니다.** 아크봇, 세온 같은 로봇 OEM 고객이 일체형 중공축 액추에이터를 요구합니다. 세온의 RFQ 마감은 2026년 7월 31일입니다. 그런데 이 신호가 영업 카톡, CRM, 엑셀에 흩어져 있어 본부장에게 제때 올라가지 않습니다.\n2. **분기 포트폴리오 리뷰 준비에 2주가 걸립니다.** 그중 VOC 집계와 경쟁사 비교에만 1주가 듭니다. 팀장이 직접 관리하는 매크로 엑셀이 병목입니다.\n3. **가격 판단 노하우가 한경수 부장 머릿속에만 있습니다.** 한 부장은 2027년 6월 정년퇴직합니다.\n4. **영업과 상품기획 사이에 정치적 긴장이 있습니다.** 영업은 VOC 원본에 할인 조건이 섞여 있어 공유를 꺼립니다. 상품기획은 영업이 할인을 남발한다고 봅니다.\n\n→ 난제 판정 (10-09 기준): **조직 구조 유형**(영업↔상품기획 간 데이터 공유)과 **시간 압박**(RFQ 마감)이 겹친 문제입니다.\n\n---\n\n## 2. 정준 암묵지 목록 (K1~K12)\n\n6주차 이후 모든 정답의 기준입니다. 프롬프트 로그와 인터뷰에 흩어져 있으며, 수강생은 이 중 10개 이상을 찾아야 합니다.\n\n| ID | 암묵지 | 보유자 | 드러나는 곳 |\n|---|---|---|---|\n| K1 | 대리점 판매가는 대리점 마진 18% 보장선 아래로 내리지 않는다 | 한경수 | 인터뷰 |\n| K2 | 신규 고객 첫 견적 할인 한도는 영업 기준 12%, 상품기획 기준 15%, 로봇 OEM은 최대 20% | 영업 / 상품기획 | CRM 메모, 인터뷰 **(충돌 1)** |\n| K3 | 납기 불만은 상품기획 이슈가 아니라 SCM 이슈다. 리포트에서 빼고 SCM에 넘긴다 | 문서진 | 프롬프트 로그 |\n| K4 | 강 전무 보고는 결론 먼저, 핵심 숫자 3개, 표는 1장, 경쟁사 이름은 실명으로 | 문서진 | 프롬프트 로그 |\n| K5 | \"수요\"의 뜻이 부서마다 다르다. 영업은 견적 요청 수량, 상품기획은 수주 확정 수량 | 영업 / 상품기획 | 프롬프트 로그, 인터뷰 **(충돌 2)** |\n| K6 | 전시회 리드 중 방문만 한 건은 빼고, 샘플이나 견적을 요청한 건만 유효 리드로 본다 | 배수빈 / 문서진 | 프롬프트 로그 |\n| K7 | 경쟁사 비교는 카탈로그 최대 토크가 아니라 데이터시트의 연속 토크로 한다 | 한경수 | 인터뷰 |\n| K8 | 같은 고객이 같은 이슈를 반복 제기하면 1건으로 센다 | 문서진 (매크로 규칙) | 프롬프트 로그 |\n| K9 | 로봇 OEM 3사(누리로보틱스, 세온, 아크봇)의 요청은 가중치 2배. 전무 방침이며 문서는 없다 | 강도윤 → 문서진 | 프롬프트 로그 **(충돌 3: 근거 문서 없음)** |\n| K10 | 분기 리뷰에는 SAP 마감(익월 5영업일) 이후 수치만 쓴다. 그 전에는 \"잠정\"으로 표기한다 | 최은재 / 문서진 | 프롬프트 로그 |\n| K11 | 단종 검토 기준: 2분기 연속 매출 감소이면서 마진율 22% 미만 | 한경수 | 인터뷰 |\n| K12 | 중국산 경쟁품과 비교할 때는 가격이 아니라 총소유비용(TCO)으로 이야기한다 | 문서진 / 마케팅 | 프롬프트 로그 |\n\n**충돌 해결 정답 (6주차, 04-09 영상의 3단계 순서)**\n\n- **충돌 1 (K2 할인 한도)**\n  - 판단: **팩트 오류와 맥락 차이가 섞여 있습니다.** 한 부장 인터뷰에 따르면 영업 12%는 2024년 이전 기준이고, 지금은 15%입니다. 영업 쪽 교육이 안 되었을 뿐입니다. 로봇 OEM 20%는 LOI가 있고 전무가 승인했을 때만 적용하는 조건부 맥락입니다.\n  - 처리:\n    - 12%는 \"폐기됨(2024)\" 태그를 붙여 이력으로만 남깁니다.\n    - 현행 15%와 조건부 20%를 남깁니다.\n    - 영업에 공유해야 할 액션 아이템을 만듭니다.\n- **충돌 2 (K5 수요)**\n  - 판단: 용어의 부서별 맥락 차이입니다.\n  - 처리: 용어집에 `수요(영업)=견적요청수량`, `수요(상품기획)=수주확정수량`을 따로 둡니다. 리포트에는 어느 정의를 썼는지 반드시 표기합니다.\n- **충돌 3 (K9 가중치)**\n  - 판단: 근거 문서가 없습니다. 조직문화 확인 단계로 넘깁니다.\n  - 처리: \"원래 이 회사는 어떻게 하나?\"를 묻는 질문을 문서진 팀장을 거쳐 강 전무에게 확인합니다. 정답 시나리오에서는 전무가 \"맞다, 단 2026년 말까지\"라고 답합니다. 만료일 태그를 붙입니다.\n\n---\n\n## 3. 인물별 숨은 정보와 롤플레이 지침\n\n**공통 원칙:** 묻지 않은 것은 말하지 않습니다. 질문이 구체적일수록 더 많이 공개합니다. 수강생이 \"누구에게 칭찬받을지\"를 묻는 질문(10-05)을 하면, 그 인물의 진짜 KPI를 말해 줍니다.\n\n### 강도윤 전무 (스폰서)\n- **진짜 원하는 것**\n  - 3분기 이사회에서 \"AI로 의사결정이 빨라졌다\"는 사례 1건\n  - DX-7 출시 여부 결정. 2024년 B2 실패 이후 근거 없는 출시를 두려워합니다.\n- **숨은 정보**\n  - 로봇 OEM 가중치 2배 방침(K9)을 구두로 지시했습니다.\n  - 세온 RFQ를 놓치면 2027년 로봇 매출 계획에 구멍이 납니다.\n- **정보 공개 조건:** \"이 프로젝트가 성공하면 이사회에서 무엇을 말씀하시겠어요?\"라고 물으면 위 내용을 말합니다.\n- **11주차 이벤트:** 성공 기준을 \"월간 리포트 자동화\"에서 \"**DX-7 출시 Go/No-go 근거 자료를 8월 첫째 주까지**\"로 바꿉니다.\n\n### 문서진 팀장 (꼭짓점, 메인 클라이언트)\n- **진짜 원하는 것:** 분기 리뷰 준비를 2주에서 3일로 줄이는 것. 본인이 병목이라는 사실을 알고 있습니다.\n- **숨은 정보**\n  - \"VOC집계_v7.xlsm\" 매크로를 혼자 관리합니다. K3, K8, K9 규칙이 매크로 안에 있습니다.\n  - RFP의 에이전트 5종은 다른 회사 사례를 보고 쓴 것입니다. 실제 우선순위는 VOC와 분기 리뷰입니다.\n- **공개 조건:** \"에이전트 5개 중 하나만 된다면 무엇이 남아야 하나요?\"라고 물으면 진짜 우선순위를 말합니다.\n\n### 한경수 부장 (시니어, 메인테이너 후보 A)\n- **진짜 원하는 것:** 퇴직 전에 자기 방식이 \"제대로\" 남는 것. 동시에 AI가 자기 판단을 대체하는 것은 경계합니다.\n- **숨은 정보:** K1, K7, K11을 보유하고 있습니다. 2027년 6월 정년퇴직합니다.\n- **공개 조건:** \"AI가 대신하는 게 아니라 부장님 방식을 남기는 것\"이라는 프레이밍에 마음을 엽니다. 처음부터 \"자동화\"를 말하면 방어적으로 굽니다.\n- **12주차 이벤트:** 건강 문제로 2개월 휴직합니다. 메인테이너를 다시 정해야 합니다.\n\n### 오지민 사원 (주니어, 메인테이너 후보 B)\n- **진짜 원하는 것:** 단순 취합 업무에서 벗어나 기획 업무를 하는 것.\n- **숨은 정보:** 개인적으로 AI 도구를 써 본 경험이 있습니다. VOC 원본이 어디 있는지 가장 잘 압니다.\n- **공개 조건:** 개인 업무 방식을 물어보면 말합니다.\n\n### 윤태호 차장 (숨은 키맨)\n- **진짜 원하는 것:** 할인 조건이 상품기획에 그대로 노출되지 않는 것. 로봇 OEM 수주.\n- **숨은 정보**\n  - 영업사원 VOC를 실제로 모으는 사람입니다.\n  - 아크봇은 8월까지 샘플이 필요합니다. 세온은 일체형 로드맵만이라도 원합니다.\n- **등장 방식:** 4주차 첫날에는 인물 목록에 이름만 있습니다. 수강생이 \"VOC 원본은 누가 모으나요?\"라고 물어야 인터뷰가 잡힙니다. 이 인물을 찾았는지가 4주차 평가의 핵심입니다.\n- **공개 조건:** \"할인 정보는 가리고 VOC만 받는 방법\"을 제안하면 협조합니다.\n\n### 배수빈 과장\n- **숨은 정보:** 전시회 리드 중 일체형 관련 유효 리드가 5건입니다. 아무도 이 숫자를 묻지 않았습니다.\n\n### 최은재 차장\n- **숨은 정보:** SAP 판매 리포트를 주간 CSV로 자동 추출할 수 있습니다. 단가 컬럼을 빼는 조건입니다.\n- **공개 조건:** 월마감 기간(1~5영업일)을 피해서 요청해야 합니다.\n\n### 정해린 책임 (IT·정보보안)\n- **숨은 정보**\n  - R&D 파일럿용 사내 승인 코딩 에이전트(엔터프라이즈 계약, 데이터 학습 제외 조항)가 이미 있습니다. 상품기획팀으로 확장하려면 신청서와 데이터 분류표가 필요합니다.\n  - 판매 단가와 고객별 할인은 \"대외비 A\"로 외부 전송이 금지됩니다. 집계 수치와 공개 스펙은 \"일반\"입니다.\n- **공개 조건:** \"어떤 데이터가 어느 등급인지 표로 만들어 오겠다\"고 하면 협조합니다. 3주차와 4주차의 핵심 인물입니다.\n\n---\n\n## 4. 주차별 이벤트 일정\n\n| 주차 | 이벤트 | 목적 |\n|---|---|---|\n| 4 | 윤태호가 첫날 인물 목록에서 빠져 있음 | 숨은 키맨 찾기 |\n| 5 | 문서진 팀장이 \"가격 시뮬레이션도 이번에 꼭\"이라며 범위를 넓힘 | 범위 관리, 먼저 바꾸자고 제안하기 |\n| 7 | 정해린 책임이 \"단가가 프롬프트에 들어가면 안 된다\"며 데모를 중단 | 거버넌스 |\n| 10 | 영업이 낸 신규요구 건수와 상품기획 집계가 다름 (K2, K5 충돌 재연) | 지식 충돌 |\n| 11 | 강 전무가 성공 기준을 DX-7 Go/No-go로 변경 | 범위 변경, 버티컬 AX |\n| 12 | 한경수 부장 휴직 → 메인테이너 재선정 | 내재화 |\n\n---\n\n## 5. 데이터에서 확인되는 정답 수치\n\n예상 산출물은 모두 이 숫자와 맞아야 합니다.\n\n**판매 데이터** (`sales_sap_extract.csv`)\n- DS3-100 분기 매출(백만 원): 25Q3 803 → 25Q4 662 → 26Q1 554 → 26Q2 466\n- DS3-100 마진율: 20.3% → 20.7% → 18.2% → 18.6%\n- → K11 기준을 충족하므로 **단종 검토 대상**입니다.\n- DX5-750 분기 매출: 1,698 → 2,179 → 2,688 → 3,461 (26Q2는 전분기 대비 +28.8%)\n- 2026년 상반기 매출: DS-3 14,470 / DX-5 12,588 / HR 5,025 / 합계 32,083\n- DX-5 2026년 상반기 고객유형별 매출: 로봇OEM 6,752 (53.6%), 장비OEM 2,626, 대리점 1,811, 직판 1,400\n\n**VOC 데이터** (`voc_raw.csv`, 정답은 `voc_answer_key.csv`)\n- 원본 56행. K8 중복 제거 후 37건\n- 분류별 건수: SW·튜닝 8, 신규요구 8, 납기 7, 성능 4, 가격 4, 기술지원 4, 품질 2\n- 상품기획 리포트 포함: 28건 (납기 7건은 SCM, 품질 2건은 품질팀으로 넘김)\n- K9 가중치 적용 후: 신규요구 14, SW·튜닝 11, 기술지원 8, 성능 6, 가격 6\n- → 가중치를 안 쓰면 신규요구와 SW·튜닝이 8건으로 **동률**입니다. 가중치를 쓰면 **신규요구가 1위**입니다.\n- 신규요구 고객별: 아크봇 3, 누리로보틱스 2, 그린텍 2, 세온 1\n\n**전시회 리드** (`expo_leads.csv`)\n- 전체 16건. 방문만 한 7건을 빼면 유효 리드 9건\n- 유효 리드 중 일체형·중공축 관련 5건\n\n**경쟁사 비교** (`competitor_specs.csv`)\n- 미라텍 MR-A750: 카탈로그 최대 토크(7.5)는 자사 DX5-750(7.16)보다 높습니다. 하지만 연속 토크는 2.25로 자사 2.39보다 **낮습니다**. → K7을 적용하면 결론이 뒤집힙니다.\n- MR-H70J의 연속 토크는 영업 구두 확인값이라 신뢰도가 낮습니다. 출처 태그가 필요합니다.\n- Zhenli ZL-100(245천 원) vs DS3-100(380천 원) → K12에 따라 가격이 아니라 TCO로 비교해야 합니다.\n", "csv": null, "cls": ""}, {"id": "readiness", "group": "강사 전용", "label": "준비도 평가·플레이북", "md": "# 1인 FDE 투입 준비도 평가와 실전 첫 2주 플레이북\n\n> 12주차에 수강생이 자가평가하고, 강사가 같은 표로 평가합니다. 두 점수의 차이가 큰 항목이 수료 후 보완 과제가 됩니다.\n> 최종 목표는 \"실제 조직의 AX에 1인 FDE로 투입될 수 있는 상태\"입니다.\n\n---\n\n## 1. 준비도 평가 (13개 역량)\n\n**점수 기준**\n- 0점: 못 함\n- 1점: 도움을 받으면 함\n- 2점: 혼자 함\n- 3점: 혼자 하고 남에게 가르칠 수 있음\n\n| # | 역량 | 증거 (어느 주차 산출물) | 근거 영상 | 자가 | 강사 |\n|---|---|---|---|---|---|\n| 1 | RFP에서 SI 문법을 찾아 FDE 방식으로 다시 쓴다 | W1 제안서, W3 설계서 | 07-06, 08-12 | | |\n| 2 | 본인 업무를 비가역적으로 자동화하고 스킬로 만든다 | W2 스킬 | 02-27 | | |\n| 3 | 데이터 등급을 분류하고 승인 경로를 확보한다 | W3 매트릭스, W4 등급표, W9 이전 체크리스트 | 03-11 | | |\n| 4 | 숨은 키맨을 찾는다 | W4 맵 v2 (윤태호) | 10-05 | | |\n| 5 | 진짜 KPI를 끌어내는 질문을 한다 | W4 인터뷰 노트 | 10-05 | | |\n| 6 | 난제를 판별하고 범위 변경에 먼저 대안을 낸다 | W5 판정표·메모, W11 계획 | 10-09 | | |\n| 7 | 암묵지를 지시 로그와 인터뷰에서 추출하고 태깅한다 | W6 그래프 | 04-09 | | |\n| 8 | 지식 충돌을 3단계로 해결한다 | W6, W10 | 04-09 | | |\n| 9 | 버티컬 워크플로를 스킬 연결로 구현한다 | W7, W11 | 06-11, 07-06 | | |\n| 10 | 강건성·성능 평가와 워크슬롭 검수를 한다 | W7 평가셋, W10 검토 코멘트 | 03-11, 04-21 | | |\n| 11 | 메인테이너를 양성하고 인수를 완료한다 | W8 패키지, W12 확인서 | 08-12, 09-30 | | |\n| 12 | 혼자서도 부담을 나누는 구조를 운영한다 | W8 계획, 주간 공유 기록 | 07-14 | | |\n| 13 | 구현 전에 최신 자료를 조사해 접근 방식을 고객과 합의한다 (출처 확인 포함) | W5 리서치 브리프, W11 어프로치 메모 | 11-02 | | |\n\n> 파운더 스피릿(야망, 집착, 끈기, 롱텀에서 지치지 않음)은 이 표에서 점수로 매기지 않습니다. 화자는 스피릿을 \"시험이 아니라 관찰\"로 찾으라고 말합니다 (11-05). 강사는 과정 중 관찰한 신호를 별도 관찰 노트로 남깁니다.\n\n**판정**\n- **투입 가능:** 모든 항목 2점 이상이고, 4·6·11번은 3점\n- **조건부 투입:** 2점 미만이 2개 이하이고, 경력 FDE의 멘토링을 받는 조건\n- **추가 훈련:** 위 조건에 미달\n\n---\n\n## 2. 실전 투입 첫 2주 플레이북 (어느 조직에나 적용)\n\n이번 케이스에서 얻은 패턴을 일반화했습니다.\n\n| 일차 | 할 일 | 산출물 | 이 과정의 대응 주차 |\n|---|---|---|---|\n| D1 | 스폰서 미팅. \"성공하면 누구에게 무엇을 보고하나\" 질문 | 스폰서 KPI 1줄 | W4 |\n| D1 | 보안 담당 미팅. 승인된 AI 도구, 데이터 등급 확인 | 등급표 v0 | W3, W4 |\n| D2–3 | 실무 책임자와 실무자 인터뷰. \"하나만 된다면?\", \"이 데이터는 누구에게서 받나?\" | 토폴로지 맵 v1 | W4 |\n| D4 | 맵에서 빈 곳(데이터 원천, 숨은 키맨) 추가 인터뷰 | 맵 v2, 메인테이너 후보 2명 | W4 |\n| D5 | 난제 판정과 문제 정의서 초안. 구현 전에 접근 방식 조사(리서치 브리프) 후 스폰서와 15분 논의 | 문제 정의서 v0, 리서치 브리프 | W5 |\n| D6–7 | 실무 책임자가 1주일간 에이전트로 일하도록 세팅 (지시 로그 수집 시작) | 공통 지침 v0, 스킬 2~3개 | W2, W6 |\n| D function parseCSV(t){const rows=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}

  if(f||r.length){r.push(f);rows.push(r)}return rows}
