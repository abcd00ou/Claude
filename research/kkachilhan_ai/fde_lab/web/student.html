<style>
/* Layout: course binder. Left index of tabs (case, data, weeks, instructor), one document open at a time on the right; prev/next at the foot like turning pages. */
:root{
  --paper:#eef1f6; --surface:#ffffff; --ink:#16213a; --ink-2:#4a5672; --rule:#cfd6e3;
  --accent:#2f4fd8; --accent-soft:#e3e8fb; --mark:#ffe14d;
  --answer:#fff7e0; --answer-rule:#d9a21b; --answer-ink:#7a5200;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
:root[data-mode="instructor"]{--accent:#b4551f; --accent-soft:#f8e6da}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --paper:#0f1524; --surface:#171f33; --ink:#e6eaf4; --ink-2:#9ea9c3; --rule:#2a3550;
    --accent:#8ea4ff; --accent-soft:#222c48; --mark:#6b5a00;
    --answer:#2a2410; --answer-rule:#c8961e; --answer-ink:#f0cf7a;}
  :root[data-mode="instructor"]:not([data-theme="light"]){--accent:#f0a070; --accent-soft:#3a2618}
}
:root[data-theme="dark"]{color-scheme:dark;
  --paper:#0f1524; --surface:#171f33; --ink:#e6eaf4; --ink-2:#9ea9c3; --rule:#2a3550;
  --accent:#8ea4ff; --accent-soft:#222c48; --mark:#6b5a00;
  --answer:#2a2410; --answer-rule:#c8961e; --answer-ink:#f0cf7a;}
:root[data-theme="dark"][data-mode="instructor"]{--accent:#f0a070; --accent-soft:#3a2618}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.72;margin:0;padding-inline:16px}
.shell{max-width:1180px;margin:0 auto;padding-block:24px 64px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px}
header.top{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;border-bottom:2px solid var(--ink);padding-bottom:14px}
header.top h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,38px);margin:0;line-height:1.15}
.badge{font-family:var(--mono);font-size:12px;letter-spacing:.06em;background:var(--accent);color:var(--surface);padding:3px 10px;border-radius:3px}
header.top p{margin:0;flex-basis:100%;color:var(--ink-2);font-size:14px}
nav.idx{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;max-height:calc(100vh - 32px);overflow:auto;display:grid;gap:14px;padding-right:4px}
nav.idx .g{display:grid;gap:2px}
nav.idx .gl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);padding:0 8px 2px}
nav.idx a{display:block;padding:5px 8px;border-radius:4px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
nav.idx a:hover{background:var(--accent-soft)}
nav.idx a[aria-current="page"]{background:var(--accent);color:var(--surface)}
nav.idx a.gated::after{content:" ·잠금";font-size:11px;opacity:.7}
.wk-t{display:block;font-size:12px;color:var(--ink-2)}
nav.idx a[aria-current="page"] .wk-t{color:inherit;opacity:.85}
select.mnav{display:none;width:100%;font:inherit;padding:8px;border:1px solid var(--rule);border-radius:4px;background:var(--surface);color:var(--ink)}
main{min-width:0}
article.doc{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:28px clamp(18px,4vw,44px) 36px}
.doc h1{font-family:var(--display);font-weight:400;font-size:clamp(24px,3.4vw,32px);line-height:1.25;margin:0 0 14px;text-wrap:balance}
.doc h2{font-size:20px;margin:34px 0 10px;padding-top:12px;border-top:1px solid var(--rule);text-wrap:balance}
.doc h3{font-size:16.5px;margin:24px 0 6px}
.doc h4{font-size:15px;margin:18px 0 4px}
.doc p,.doc li{max-width:72ch}
.doc ul,.doc ol{padding-left:22px}
.doc li+li{margin-top:3px}
.doc a{color:var(--accent)}
.doc hr{border:0;border-top:2px dashed var(--rule);margin:32px 0}
.doc blockquote{margin:14px 0;padding:10px 16px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 4px 4px 0}
.doc blockquote p{margin:6px 0}
.doc code{font-family:var(--mono);font-size:.88em;background:var(--accent-soft);padding:1px 5px;border-radius:3px}
.doc pre{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:12px 14px;overflow-x:auto;font-size:13px;line-height:1.55}
.doc pre code{background:none;padding:0}
.tw{overflow-x:auto;margin:12px 0;border:1px solid var(--rule);border-radius:4px}
.doc table{border-collapse:collapse;width:100%;font-size:13.5px}
.doc th,.doc td{text-align:left;vertical-align:top;padding:7px 10px;border-bottom:1px solid var(--rule)}
.doc thead th{background:var(--paper);font-weight:500;color:var(--ink-2);white-space:nowrap}
.doc tbody tr:last-child td{border-bottom:0}
.doc td{font-variant-numeric:tabular-nums}
.doc input[type=checkbox]{margin-right:6px}
.answer{margin-top:28px;background:var(--answer);border:1px solid var(--answer-rule);border-radius:6px;padding:4px 20px 18px}
.answer>h2:first-child{border-top:0;color:var(--answer-ink);margin-top:14px}
.answer>h2:first-child::before{content:"강사용 · ";font-family:var(--mono);font-size:13px;font-weight:500}
.notice{background:var(--answer);border:1px solid var(--answer-rule);color:var(--answer-ink);border-radius:6px;padding:12px 16px;margin-bottom:18px;font-size:14px}
.notice button{font:inherit;margin-top:8px;border:1px solid var(--answer-rule);background:var(--surface);color:var(--ink);border-radius:4px;padding:4px 12px;cursor:pointer}
.csvmeta{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--mono);font-size:12.5px;color:var(--ink-2);margin-bottom:8px}
.csvwrap{max-height:70vh;overflow:auto;border:1px solid var(--rule);border-radius:4px}
.csvwrap table{font-size:12.5px}
.csvwrap thead th{position:sticky;top:0}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
.pager a{flex:1;display:grid;gap:2px;padding:12px 14px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);text-decoration:none;color:var(--ink);font-size:14px}
.pager a:hover{border-color:var(--accent)}
.pager a span{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.pager a.next{text-align:right}
.pager a[hidden]{display:none}
a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mermaid{background:var(--surface);overflow-x:auto;text-align:center}
@media (max-width:860px){
  .shell{grid-template-columns:1fr;gap:16px}
  nav.idx{display:none}
  select.mnav{display:block}
}
@media print{nav.idx,select.mnav,.pager{display:none}.shell{display:block}}
</style>

<script>
document.documentElement.dataset.mode="student";
const S=[{"id": "intro", "group": "시작", "label": "수강생 안내", "md": "# 수강생 안내\n\n이 페이지는 **12주 FDE 실습 랩**의 수강생용 자료입니다. 가상 제조사 **대성모션 모션사업본부 상품기획팀**의 AX 프로젝트 하나를 12주 동안 처음부터 끝까지 수행합니다.\n\n- **목표:** 12주 뒤 1인 FDE로 실제 조직의 AX에 투입될 수 있는 상태가 되는 것\n- **진행 방식**\n  - 1~8주차는 모듈 학습과 실습을 하고, 수강생끼리 동료 리뷰를 합니다.\n  - 9~12주차 캡스톤은 혼자 수행합니다. 외부 멘토 리뷰는 주 1회만 허용됩니다.\n- **AX 타임:** 과정 내내 하루 2시간은 엑셀이나 문서 도구를 직접 열지 않고 AI로만 일합니다. 진행 상황은 스레드로 공유합니다.\n- **빌드업:** 매주 만든 산출물은 다음 주의 입력이 됩니다. 버전 번호(v0 → v1 → v2)를 붙여 보관하세요.\n- **자료 공개 일정:** 6주차 자료(팀장 지시 로그, 시니어 인터뷰)는 6주차에 강사 안내를 받은 뒤에 여세요.\n- **모범 답안:** 예상 산출물은 과제를 제출한 뒤 강사 피드백 때 공개됩니다.\n\n> 회사, 인물, 데이터는 모두 교육용 가상 자료입니다. 방법론의 근거는 유튜브 '까칠한 AI'(황현태) 영상이며, 각 주차에 영상 날짜를 표기했습니다.\n", "csv": null, "cls": ""}, {"id": "company", "group": "케이스", "label": "회사·조직·RFP", "md": "# 케이스: 대성모션 모션사업본부 상품기획팀\n\n> **가상 회사입니다.** 회사, 인물, 수치, 경쟁사(미라텍, 한결드라이브, Kestrel Motion, Zhenli)는 모두 교육용으로 만든 것입니다. 실제 기업과 관계없습니다.\n> 수강생에게 공개하는 자료입니다. 숨은 정보는 `instructor/case_secrets.md`에 있습니다.\n\n## 1. 회사 개요\n\n| 항목 | 내용 |\n|---|---|\n| 회사명 | 대성모션(주) (가상) |\n| 업종 | 산업용 서보모터, 서보드라이브, 정밀 감속기 제조 (B2B) |\n| 규모 | 임직원 약 1,100명, 연매출 약 2,100억 원 |\n| 사업본부 | 모션사업본부(서보·감속기, 연 약 650억 원), 드라이브사업본부, 해외사업본부 |\n| 판매 채널 | 대리점, 로봇 OEM, 장비 OEM, 직판 |\n| IT 환경 | SAP ERP(판매·원가), 사내 CRM(영업 메모 위주), M365. 외부 생성형 AI는 원칙적으로 금지. R&D센터만 사내 승인 코딩 에이전트를 파일럿 운영 중 |\n\n## 2. 제품 라인업 (모션사업본부)\n\n| 제품군 | 모델 | 포지션 |\n|---|---|---|\n| DS-3 | DS3-100 / 400 / 750 / 1K5 / 3K | 범용 서보. 물량의 중심. 포장기, 공작기계, 대리점 판매 |\n| DX-5 | DX5-400 / 750 / 1K | 고정밀 서보. 로봇 OEM 매출 비중이 높음 |\n| HR | HR-40 / 60 | 정밀 감속기. 로봇 관절과 AMR용 |\n| (기획 중) DX-7 | 미정 | 협동로봇 관절용 **모터+감속기 일체형 중공축 액추에이터**. 2025년 말 컨셉만 있음 |\n| (단종) B2 | – | 2024년 출시한 저가형. 경쟁사 저가 제품에 밀려 1년 만에 철수 |\n\n**최근 실적 요약** (`data/sales_sap_extract.csv`, 단위: 백만 원)\n\n| 기간 | DS-3 | DX-5 | HR | 합계 |\n|---|---|---|---|---|\n| 2026년 상반기 | 14,470 | 12,588 | 5,025 | 32,083 |\n\n## 3. 대상 조직: 상품기획팀 (8명)\n\n```\n모션사업본부장 (강도윤 전무)\n ├─ 국내영업실 ─ 영업1팀, 영업2팀(윤태호 차장 등), 영업기획팀(최은재 차장)\n ├─ 마케팅팀 (배수빈 과장)\n └─ 상품기획팀 (문서진 팀장)\n      ├─ 한경수 부장 (시니어, 가격·포트폴리오)\n      ├─ 차장 1, 과장 2, 대리 1\n      └─ 오지민 사원 (2년차)\n지원 조직: IT·정보보안팀 (정해린 책임)\n```\n\n**상품기획팀이 반복하는 업무**\n\n| 주기 | 업무 | 산출물 | 받는 사람 |\n|---|---|---|---|\n| 주간 | 영업 VOC 취합·분류 | VOC 집계 엑셀 (\"VOC집계_v7.xlsm\") | 팀장 |\n| 주간 | 경쟁사 동향 정리 | 경쟁사 비교표 | 팀장, 영업 |\n| 월간 | 시장·VOC 리포트 | PPT 10~15장 | 본부장 |\n| 분기 | 제품 포트폴리오 리뷰 | 포트폴리오 의사결정 자료 (출시, 단종, 가격) | 본부장 주관 회의 |\n| 수시 | 가격 정책안, 특판가 검토 | 가격 검토 메모 | 영업, 본부장 |\n| 수시 | 신제품 기획서 (PRD) | 기획서 | 본부장, R&D |\n\n## 4. 원래 RFP (고객사가 처음 보낸 요청서 원문)\n\n> **[제안요청서] 상품기획 업무 AI 에이전트 구축**\n>\n> 1. **목적:** 생성형 AI를 활용한 상품기획 업무 자동화와 고도화\n> 2. **범위:** 아래 AI 에이전트 5종 구축\n>    - ① VOC 자동 분류 에이전트\n>    - ② 경쟁사 동향 모니터링 에이전트\n>    - ③ 월간 리포트 자동 작성 에이전트\n>    - ④ 가격 시뮬레이션 에이전트\n>    - ⑤ 신제품 기획서 초안 작성 에이전트\n> 3. **기간:** 구축 6개월, 이후 유지보수 12개월 (별도 계약)\n> 4. **산출물:** 에이전트 5종(소스 포함), 사용자 매뉴얼, 운영자 교육 1회\n> 5. **조건:** 사내 보안 규정 준수(외부 클라우드 전송 금지 데이터 포함). 대시보드 제공\n> 6. **평가:** 기술 60%, 가격 40%\n>\n> — 대성모션 모션사업본부 상품기획팀\n\n## 5. 공개된 배경 정보\n- 2026년 상반기 협동로봇 고객의 문의가 늘었습니다.\n- 경쟁사 미라텍이 2026년 5월 전시회에서 일체형 중공축 제품(MR-H70J)을 공개했습니다.\n- 본부장은 2026년 3분기 이사회에 \"AI 활용 성과\"를 보고해야 합니다.\n- 상품기획팀의 분기 포트폴리오 리뷰 준비에는 통상 2주가 걸립니다.\n\n## 6. 데이터 패키지 (`case/data/`)\n\n| 파일 | 내용 | 상태 |\n|---|---|---|\n| `sales_sap_extract.csv` | 2025년 7월~2026년 6월 모델·고객유형별 판매 (SAP 마감 기준) | 정제됨 |\n| `price_list.csv` | 표준가, 표준원가, 대리점 공급가 | 정제됨 |\n| `voc_raw.csv` | 2026년 4~6월 영업 VOC 56행 (카톡, 전화, CRM 혼재) | **지저분함**: 날짜 형식 4가지, 고객명 변형, 중복, 분류 누락 |\n| `crm_notes.csv` | 영업 CRM 메모 13건 | 할인 조건과 VOC가 섞여 있음 |\n| `competitor_specs.csv` | 자사와 경쟁사 스펙, 가격, 납기 | 출처 신뢰도가 제각각 |\n| `expo_leads.csv` | 2026 전시회 리드 16건 | 방문만 한 리드 포함 |\n| `prompt_log_moon.md` | 문서진 팀장의 에이전트 지시 로그 1주일치 (6주차부터 공개) | |\n| `interview_han.md` | 한경수 부장 인터뷰 녹취 요약 (6주차부터 공개) | |\n", "csv": null, "cls": ""}, {"id": "people", "group": "케이스", "label": "인물 카드", "md": "# 인물 카드 (수강생 공개용)\n\n> 가상 인물입니다. 수강생은 여기 적힌 정보만 알고 시작합니다.\n> 롤플레이에서 강사가 이 인물들을 연기합니다. 각 인물의 숨은 정보는 `instructor/case_secrets.md`에 있습니다.\n\n| 인물 | 직책 | 공개된 역할 | 첫  데이터시트 연속 토크로 비교하라고 하셔. 카탈로그는 다 뻥튀기라고.\n\n**[07-07 13:50] 피드백:** H70J 연속 토크는 윤 차장이 전화로 들은 거라 확실하지 않아. 표에 \"구두 확인\"이라고 달아.\n\n**[07-08 10:05]** 2분기 실적 요약해줘. SAP 데이터로.\n\n**[07-08 10:20] 피드백:** 6월 숫자는 7월 7일 마감 끝났으니 확정으로 써도 돼. 마감 전이면 잠정이라고 꼭 붙여. 최 차장이 그거 틀리면 난리 나.\n\n**[07-08 14:00]** 전시회 리드 정리. 배 과장이 준 리스트.\n\n**[07-08 14:15] 피드백:** 그냥 부스에 들른 건 리드 아니야. 샘플이나 견적 달라고 한 것만 세.\n\n**[07-08 16:30]** Zhenli 대응 메시지 초안. 대리점용.\n\n**[07-08 16:50] 피드백:** 가격으로 싸우면 진다. 수명, 튜닝 시간, AS 포함해서 총비용으로 말하는 걸로 바꿔. 마케팅이랑 늘 그렇게 해 왔어.\n\n**[07-09 09:00]** 분기 리뷰 자료 목차 잡아줘.\n\n**[07-09 09:25] 피드백:** 단종 후보 페이지 넣어. 기준은 한 부장님한테 확인해. 나도 정확히는 몰라. 2분기 연속 빠지는 거였나.\n\n**[07-09 11:10]** 영업에서 온 \"신규요구 수요 2,400대\" 숫자 리포트에 넣어줘.\n\n**[07-09 11:30] 피드백:** 잠깐, 영업이 말하는 수요는 견적 요청 수량이야. 우리는 수주 확정 기준으로 써. 같은 단어인데 뜻이 달라. 둘 다 쓸 거면 어느 기준인지 꼭 적어.\n\n**[07-09 15:00]** 특판가 요청 건 검토 메모. 성우자동화 DS3-100.\n\n**[07-09 15:20] 피드백:** 영업은 12%까지라고 했다는데 우리 기준은 15%야. 근데 대리점 마진 선은 한 부장님 기준이 따로 있어. 그건 부장님한테 물어봐.\n\n**[07-10 10:00]** 이번 주 한 일 정리해줘.\n\n**[07-10 10:30] 피드백:** 좋아. 근데 내가 이번 주에 너한테 말한 규칙들, 다음 주에도 기억해야 돼. 오 사원이 써도 똑같이 나오게.\n", "csv": null, "cls": "gated"}, {"id": "han", "group": "데이터", "label": "시니어 인터뷰 (6주차)", "md": "# 한경수 부장 인터뷰 녹취 요약 (2026-07-08, 60분)\n\n> 6주차 실습 자료입니다. 가상 자료입니다. FDE가 \"부장님 방식을 남기는 것\"이라고 설명한 뒤 진행한 인터뷰입니다.\n\n**Q. 특판가 요청이 오면 어떻게 판단하세요?**\n대리점 건이면 먼저 대리점 마진을 봅니다. 18% 밑으로는 절대 안 내려요. 대리점이 손해 보면 다음 분기에 우리 물건을 안 밀어요. 2019년에 한 번 그걸 깨서 대리점 두 곳이 경쟁사로 넘어갔습니다.\n\n**Q. 할인 한도는 영업 기준이랑 상품기획 기준이 다르던데요.**\n영업은 12%로 알고 있을 거예요. 예전 기준입니다. 2024년에 우리가 15%로 올렸는데 영업 교육이 안 됐어요. 로봇 OEM은 전무님 승인을 받으면 20%까지 됩니다. 물량 약속(LOI)이 있을 때만요.\n\n**Q. 경쟁사 비교는요?**\n카탈로그 최대 토크는 의미가 없어요. 순간값이라 다들 부풀립니다. 데이터시트의 연속 토크로 비교해야 진짜 비교예요. 데이터시트가 없으면 \"미확보\"라고 쓰고, 비교 결론은 내지 말아야 합니다.\n\n**Q. 단종은 어떻게 판단하세요?**\n제 기준은 두 분기 연속 매출이 빠지고 마진율이 22% 밑이면 단종 검토에 올리는 거예요. 바로 단종이 아니라 \"검토\"입니다. 대체 모델이 있는지, 대리점 재고가 얼마나 남았는지도 같이 봐야 해요.\n\n**Q. \"수요\"라는 말이 부서마다 다르게 쓰이는 것 같습니다.**\n영업한테 수요는 견적 들어온 숫자고, 우리한테는 수주 확정이에요. 그래서 회의 때 숫자가 늘 안 맞습니다. 20년째 그래요.\n\n**Q. 퇴직하시면 이런 판단은 누가 하나요?**\n그게 걱정이에요. 문 팀장도 다는 몰라요. 오 사원이 빠르긴 한데 아직 경험이 없고요. 제 기준이 어디 적혀 있으면 좋겠는데, 적어 놓으면 사람들이 상황을 안 보고 기계적으로 쓸까 봐 안 적었어요.\n", "csv": null, "cls": "gated"}, {"id": "w1", "group": "주차별 실습", "label": "1주차", "md": "# 1주차: FDE란 무엇인가 + 케이스 사전 브리프\n\n- **모듈:** M1\n- **근거 영상:** 08-12, 09-30, 10-09\n- **이번 주에 이어받는 것:** 없음 (출발점)\n- **다음 주로 넘기는 것:** 사전 브리프 v1, FDE 제안서 v0 → 3주차 아키텍처 설계와 5주차 SOW의 바탕이 됩니다.\n\n---\n\n## A. 실습 자료\n\n### 상황\n여러분은 1인 FDE입니다. 대성모션 상품기획팀이 보낸 RFP(`case/01_company.md` 4절)를 받았습니다. 고객사 미팅은 4주차부터 시작합니다. 그 전에 공개 자료만 가지고 준비합니다.\n\n### 입력 자료\n- `case/01_company.md`, `case/02_people.md`\n- `case/data/sales_sap_extract.csv`, `price_list.csv`, `competitor_specs.csv`\n  - 실제 프로젝트였다면 미팅 전에는 받지 못하는 자료입니다. 교육 편의상 공개 실적 수준의 자료로 간주합니다.\n\n### 과제\n1. **사전 브리프 (1~2쪽):** 고객사에 들어가기 전에 알고 있어야 할 것을 정리합니다.\n   - 사업 구조\n   - 실적 추세\n   - 경쟁 상황\n   - 이해관계자 가설\n   - 미팅에서 확인할 질문 10개\n2. **RFP 다시 읽기:** RFP에서 \"SI 문법\"에 해당하는 부분을 표시하고, 그 이유를 적습니다.\n3. **FDE 제안서 v0 (1쪽):** 같은 요청을 FDE 방식으로 다시 씁니다.\n   - 필수 항목: 기간, 투입 형태, 첫 4주 활동, 종료 조건, 산출물\n\n### 제출 양식\n```\n1-1_사전브리프_v1.md\n1-2_RFP_분석.md\n1-3_FDE제안서_v0.md\n```\n\n### 평가\n제출 후 강사 피드백 때 평가 기준과 함께 안내합니다.\n", "csv": null, "cls": ""}, {"id": "w2", "group": "주차별 실습", "label": "2주차", "md": "# 2주차: AI 빌더 되기 (비가역 자동화와 멀티태스킹)\n\n- **모듈:** M2\n- **근거 영상:** 02-27, 03-17, 03-26, 04-30, 07-14\n- **이어받는 것:** 1주차 사전 브리프 (어떤 반복 업무가 있는지)\n- **넘기는 것:** 재사용 가능한 스킬 3개 → 3주차 워크 OS 설계의 부품, 7주차 버티컬 워크플로의 1단계\n\n---\n\n## A. 실습 자료\n\n### 상황\n고객사에 들어가기 전에 FDE 본인이 먼저 AI 빌더가 되어야 합니다. 상품기획팀의 반복 업무 3개를 케이스 데이터로 미리 자동화해 봅니다. 이번 주 결과물은 **나중에 고객 환경에 그대로 옮길 부품**입니다.\n\n### 작업 환경 세팅 (첫날)\n- 범용 코딩 에이전트 1개 (Claude Code, Codex 등 중 하나)\n- 세션 유지 환경 (tmux 또는 그에 준하는 도구)\n- 작업 폴더 구조\n  ```\n  fde-daesung/\n  ├── AGENTS.md (또는 CLAUDE.md)   ← 프로젝트 공통 지침\n  ├── skills/                      ← 업무별 스킬\n  ├── data/                        ← case/data 복사본\n  └── out/                         ← 산출물\n  ```\n- **AX 타임:** 매일 2시간은 엑셀이나 문서 도구를 직접 열지 않습니다. 10분 단위로 진행 상황을 스레드에 남깁니다.\n\n### 과제: 자동화 3건\n1. **VOC 정제 스킬:** `voc_raw.csv` → 정규화된 VOC 테이블\n   - 날짜 통일, 고객명 정규화, 7개 분류\n2. **경쟁사 비교표 스킬:** `competitor_specs.csv` → 750W급 비교표\n   - 출처 신뢰도 표시\n3. **주간 영업 하이라이트 스킬:** `crm_notes.csv` → 주간 하이라이트 1쪽\n\n### 제약\n- 아직 고객 인터뷰 전입니다. 상품기획팀의 내부 규칙(암묵지)은 모르는 상태로 만듭니다. **모르는 부분은 \"가정\"으로 명시합니다.**\n- 동시 세션은 최대 3개까지만 돌립니다. 각 세션의 결과를 직접 검수한 기록을 남깁니다.\n\n### 제출 양식\n```\n2-1_환경세팅.md          (도구, 폴더, 공통 지침 전문)\n2-2_skills/voc_clean.md, competitor_table.md, weekly_highlight.md\n2-3_자동화보고서.md      (전후 비교, 가정 목록, 검수 기록, \"업무가 정말 없어졌나\" 판정)\n```\n\n### 평가\n제출 후 강사 피드백 때 평가 기준과 함께 안내합니다.\n", "csv": null, "cls": ""}, {"id": "w3", "group": "주차별 실습", "label": "3주차", "md": "# 3주차: 범용 에이전트와 워크 OS (RFP 재설계)\n\n- **모듈:** M3\n- **근거 영상:** 07-06, 08-20, 03-11, 04-30\n- **이어받는 것:** 1주차 RFP 분석과 제안서 v0, 2주차 스킬 3개와 공통 지침\n- **넘기는 것:** 아키텍처 설계서 v1과 데이터 등급 매트릭스 → 4주차 정해린 책임 인터뷰의 준비물이자 5주차 SOW의 기술 부분\n\n---\n\n## A. 실습 자료\n\n### 상황\nRFP는 \"에이전트 5종\"을 요구합니다. 여러분은 이를 **범용 에이전트 1개 + 스킬 + 데이터 채널 + 거버넌스** 구조로 다시 설계해서, 4주차 첫 미팅에 가져갑니다.\n\n### 과제\n1. **매핑:** RFP 에이전트 5종을 \"범용 에이전트가 수행할 스킬\"로 다시 매핑합니다. 2주차에 만든 스킬 3개를 재사용합니다.\n2. **데이터 등급 매트릭스 초안:** 데이터 6종 각각에 대해 다음을 추정합니다.\n   - 보안 등급 가설\n   - 에이전트에 넣을 수 있는 형태\n   - 데이터 소유자\n3. **거버넌스 초안**\n   - 누가 스킬과 지침을 바꿀 수 있는가\n   - 변경은 어떻게 검토하는가\n   - 로그는 어떻게 남기는가\n4. **유지보수 시나리오:** 2027년 1월에 \"VOC 분류에 '안전·인증'이 추가된다\"고 가정합니다. RFP 방식과 우리 방식의 수정 범위를 비교합니다.\n\n### 제출 양식\n```\n3-1_아키텍처설계서_v1.md\n3-2_데이터등급매트릭스_v0.md\n3-3_유지보수시나리오.md\n```\n\n### 평가\n제출 후 강사 피드백 때 평가 기준과 함께 안내합니다.\n", "csv": null, "cls": ""}, {"id": "w4", "group": "주차별 실습", "label": "4주차", "md": "# 4주차: 토폴로지 스캔 (고객사 진입)\n\n- **모듈:** M4\n- **근거 영상:** 10-05, 08-12\n- **이어받는 것:** 1주차 이해관계자 가설과 질문 10개, 3주차 데이터 등급 매트릭스 v0\n- **넘기는 것:** 토폴로지 맵 v2, 메인테이너 후보, 확정된 데이터 등급표 → 5주차 문제 정의, 8주차와 12주차 메인테이너 선정\n\n---\n\n## A. 실습 자료\n\n### 진행 방식 (롤플레이)\n- 강사들이 `instructor/case_secrets.md`의 인물을 연기합니다.\n- 수강생은 1인 FDE로 혼자 인터뷰합니다.\n\n| 날 | 일정 |\n|---|---|\n| 1일차 | 강도윤, 문서진, 한경수와 각 45분 인터뷰 → 토폴로지 맵 v1 |\n| 2일차 | 오지민, 배수빈, 최은재, 정해린 중 3명 이상과 인터뷰. **추가 인터뷰를 요청할 권한이 있습니다** → 맵 v2 |\n| 3일차 | 문서진 팀장과 맵을 함께 검토 (30분) |\n\n\n### 인터뷰 가이드 (수강생 배포용)\n- 1주차 질문 10개를 재사용합니다.\n- 인물마다 다음 세 가지를 꼭 묻습니다.\n  1. 이 일이 잘되면 누구에게 칭찬받나요?\n  2. 지금 가장 시간이 많이 드는 일은 무엇인가요?\n  3. 이 데이터는 누구에게서 받나요?\n- 3주차 데이터 등급 매트릭스를 들고 가서 정해린 책임에게 확인받습니다.\n\n### 맵 작성 규칙\n- **노드:** 인물. 역할, 진짜 KPI, 영향력(상/중/하)을 적습니다.\n- **선:** 데이터 흐름(→)과 보고 흐름(⇢)을 구분합니다.\n- 메인테이너 후보를 ★로 표시합니다.\n- 프로젝트가 실패할 때 가장 곤란해지는 사람을 ⚠로 표시합니다.\n\n### 제출 양식\n```\n4-1_토폴로지맵_v1.md, 4-1_토폴로지맵_v2.md  (mermaid 다이어그램 + 변경 이유)\n4-2_인터뷰노트.md\n4-3_데이터등급표_확정.md\n```\n\n### 평가\n제출 후 강사 피드백 때 평가 기준과 함께 안내합니다.\n", "csv": null, "cls": ""}, {"id": "w5", "group": "주차별 실습", "label": "5주차", "md": "# 5주차: 문제 정의, 난제 판별, 리서치 브리프 (SOW 합의)\n\n- **모듈:** M5\n- **근거 영상:** 10-09, 08-12, 06-11, 11-02\n- **이어받는 것:** 4주차 토폴로지 맵 v2, 인터뷰 노트, 데이터 등급표 / 3주차 아키텍처 v1 / 1주차 제안서 v0\n- **넘기는 것:** 문제 정의서 v1과 SOW(8주 실행 범위) → 6~8주차 실행과 9~12주차 캡스톤의 기준선 / 리서치 브리프의 접근 방식 → 6주차 이후 집계 기준과 암묵지 수집 범위\n\n---\n\n## A. 실습 자료\n\n### 상황\n4주차 인터뷰가 끝났습니다. 이번 주에 문서진 팀장, 강도윤 전무와 **무엇을 풀지** 합의해야 합니다.\n\n### 입력\n- 4주차 산출물 전체\n- 인터뷰에서 나온 요청 후보 6개 (아래)\n\n| # | 요청 후보 | 요청한 사람 |\n|---|---|---|\n| R1 | VOC 집계 자동화 | 문서진, 오지민 |\n| R2 | 경쟁사 비교 자동화 | 문서진 |\n| R3 | 월간·분기 리포트 자동화 | 문서진 |\n| R4 | 가격 시뮬레이션 | RFP (5주차 이벤트로 문서진이 다시 강조) |\n| R5 | DX-7(일체형) 출시 판단 근거 | 강도윤 (간접), 윤태호 |\n| R6 | 신제품 기획서 초안 | RFP |\n\n### 과제\n1. 각 후보를 **난제 판별 4문항**(10-09)으로 판정합니다.\n2. **문제 정의서 v1:**\n   - 배경\n   - 키맨별 성공 기준\n   - 범위 안과 범위 밖\n   - 기간과 중점 (확산, 실험, 완성도 중 하나)\n3. **SOW (1쪽):** 6~12주차 실행 계획, 산출물, 종료 조건.\n4. **범위 변경 이벤트 대응:** 수요일에 문 팀장이 \"가격 시뮬레이션도 이번에 꼭 넣어 주세요\"라고 요청합니다. 대응 메모를 씁니다.\n5. **리서치 브리프 (1쪽, 11-02):** 핵심 문제로 고른 후보에 대해, 구현에 들어가기 전에 접근 방식을 조사합니다.\n   - 조사 질문 3개 이내\n   - 찾은 자료: 제목, 발행처, 날짜, URL. **출처 없는 항목은 인정하지 않습니다.** AI에게 조사를 시켜도 되지만 링크를 직접 열어 확인합니다.\n   - 접근 방식 2~3안과 장단점\n   - 추천안, 그리고 실패 판단 기준과 복귀 계획\n   - 금요일에 문 팀장(강사)과 15분간 어프로치를 논의하고, 결과를 브리프 끝에 적습니다.\n\n### 제출 양식\n```\n5-1_난제판정표.md\n5-2_문제정의서_v1.md\n5-3_SOW_v1.md\n5-4_범위변경대응메모.md\n5-5_리서치브리프.md\n```\n\n### 평가\n제출 후 강사 피드백 때 평가 기준과 함께 안내합니다.\n", "csv": null, "cls": ""}, {"id": "w6", "group": "주차별 실습", "label": "6주차", "md": "# 6주차: 암묵지와 컨텍스트 그래프\n\n- **모듈:** M6\n- **근거 영상:** 03-05, 04-09, 04-02\n- **이어받는 것:** 2주차 스킬 v0.1의 **가정 목록**(교정 대상), 4주차 맵(누가 무엇을 아는지), 5주차 SOW\n- **넘기는 것:** 컨텍스트 그래프 v1, 스킬 v1(암묵지 반영), 지식 PR 템플릿 → 7주차 버티컬 데모, 8주차 인수 패키지\n\n---\n\n## A. 실습 자료\n\n### 상황\n지난주 문서진 팀장이 1주일 동안 엑셀과 PPT 대신 사내 승인 에이전트로 일했습니다. 그 지시 로그와 한경수 부장 인터뷰가 입수되었습니다.\n\n### 입력\n- `case/data/prompt_log_moon.md` (팀장 지시 로그 1주일치)\n- `case/data/interview_han.md` (한 부장 인터뷰)\n- 2주차 스킬 v0.1과 가정 목록\n\n### 과제\n1. **암묵지 추출:** 로그와 인터뷰에서 암묵지를 10개 이상 뽑습니다. 항목마다 다음 태그를 붙입니다.\n   - 화자, 부서, 직급, 적용 상황, 출처, 확신도, 만료 조건\n2. **충돌 해결:** 서로 부딪히는 지식 3건을 04-09 영상의 순서로 처리합니다.\n   - ① 팩트 오류 제거 → ② 맥락 태그로 구분 → ③ 조직문화 확인\n3. **스킬 v1:** 2주차 스킬 3개에 암묵지를 반영해 다시 실행합니다. 결과가 어떻게 달라졌는지 기록합니다.\n4. **지식 PR 템플릿:** 규칙이 바뀔 때 메인테이너가 올릴 양식을 만듭니다.\n\n### 제출 양식\n```\n6-1_컨텍스트그래프_v1.yaml (또는 .csv)\n6-2_충돌해결기록.md\n6-3_스킬_v1/ (변경 diff 포함)\n6-4_재실행결과.md\n6-5_지식PR템플릿.md\n```\n\n### 평가\n제출 후 강사 피드백 때 평가 기준과 함께 안내합니다.\n", "csv": null, "cls": ""}, {"id": "w7", "group": "주차별 실습", "label": "7주차", "md": "# 7주차: 버티컬 AX와 품질 검수\n\n- **모듈:** M7\n- **근거 영상:** 06-11, 03-11, 04-21, 07-14\n- **이어받는 것:** 6주차 컨텍스트 그래프 v1과 스킬 v1, 5주차 키맨별 성공 기준, 4주차 데이터 등급표\n- **넘기는 것:** 버티컬 워크플로 v1, 평가셋 30문항과 결과 → 8주차 인수 패키지(메인테이너 테스트용), 11주차 DX-7 판단 자료의 뼈대\n\n---\n\n## A. 실습 자료\n\n### 상황\nVOC부터 본부장 의사결정까지 한 줄로 이어지는 흐름을 만듭니다. 6월 데이터 기준 \"2026년 2분기 리뷰\"를 실제로 생성합니다.\n\n### 버티컬 3단계\n\n| 단계 | 사용자 | 입력 | 출력 | 적용 암묵지 |\n|---|---|---|---|---|\n| L1 실무 | 오지민 | voc_raw, crm_notes(마스킹), expo_leads | 정제 VOC, 유효 리드 | K3, K6, K8, K9 |\n| L2 팀장 | 문서진 | L1 출력, 경쟁사 스펙, SAP 집계 | 월간 시장·VOC 리포트 | K5, K7, K10, K12 |\n| L3 본부장 | 강도윤 | L2 출력, 단종·가격 기준 | 분기 포트폴리오 의사결정 메모 (1쪽) | K1, K4, K11 |\n\n### 과제\n1. L1 → L2 → L3를 **스킬 연결**로 구현합니다. 새 에이전트를 만들지 않습니다.\n2. **평가셋 30문항:** 강건성(같은 질문 3회 반복 시 같은 답이 나오는가)과 성능(정답 일치 여부와 실패 원인 분류)을 측정합니다.\n3. L3 의사결정 메모를 쓰고, 동료와 **워크슬롭 리뷰**를 합니다.\n4. **이벤트:** 화요일에 정해린 책임이 데모 화면에서 단가가 프롬프트에 들어간 것을 발견하고 중단시킵니다. 원인과 재발 방지책을 제출합니다.\n\n### 제출 양식\n```\n7-1_워크플로_v1.md       (스킬 연결도, 실행 순서)\n7-2_평가셋.csv, 7-2_평가결과.md\n7-3_L3_의사결정메모.md\n7-4_보안이벤트_대응.md\n```\n\n### 평가\n제출 후 강사 피드백 때 평가 기준과 함께 안내합니다.\n", "csv": null, "cls": ""}, {"id": "w8", "group": "주차별 실습", "label": "8주차", "md": "# 8주차: 내재화 설계와 1인 FDE의 부담 관리\n\n- **모듈:** M8\n- **근거 영상:** 08-12, 09-30, 10-05, 04-02, 07-14, 03-17\n- **이어받는 것:** 4주차 메인테이너 후보(★A 한경수, ★B 오지민), 6주차 지식 PR 템플릿, 7주차 워크플로와 평가셋\n- **넘기는 것:** 인수 패키지 v1, 내재화 조항, 부담 관리 계획 → 9~12주차 캡스톤에서 실전 검증\n\n---\n\n## A. 실습 자료\n\n### 상황\n실행 기간의 절반이 지났습니다. 지금부터 **FDE가 빠져도 돌아가는 구조**를 설계합니다. 1인 FDE는 팀원이 없습니다. 그래서 부담을 나눌 구조도 이번 주에 함께 설계합니다.\n\n### 과제\n1. **인수 패키지 v1**\n   - 운영 매뉴얼 (주간과 월간 실행 순서)\n   - 컨텍스트 그래프 관리 가이드\n   - 지식 PR 검토 절차\n   - 30일 동행 계획\n2. **메인테이너 역할 설계:** 오지민(주 메인테이너)과 한경수(지식 검토자)의 역할, 권한, 시간 배분을 정합니다.\n3. **내재화 조항:** SOW에 추가할 조항 문구를 씁니다.\n4. **1인 FDE 부담 관리 계획:** 07-14 영상의 자가진단과 \"부담은 혼자 지지 않는다\"를 1인 상황에 맞게 적용합니다.\n\n### 제출 양식\n```\n8-1_인수패키지_v1/ (runbook.md, graph_guide.md, pr_process.md, 30day_plan.md)\n8-2_메인테이너역할표.md\n8-3_내재화조항.md\n8-4_부담관리계획.md\n```\n\n### 평가\n제출 후 강사 피드백 때 평가 기준과 함께 안내합니다.\n", "csv": null, "cls": ""}, {"id": "w9", "group": "캡스톤 (혼자 수행)", "label": "9주차", "md": "# 9주차 (캡스톤 1/4): 실전 투입, 환경 이전과 판단 사례 수집\n\n- **캡스톤 규칙:** 9~12주차는 수강생 1명이 FDE로 혼자 수행합니다. 강사는 고객 역할만 맡고 코칭하지 않습니다. 외부 멘토 리뷰는 주 1회(8주차 계획대로) 허용합니다.\n- **이어받는 것:** 1~8주차 산출물 전부 (특히 인수 패키지 v1, 워크플로 v1, 컨텍스트 그래프 v1)\n- **넘기는 것:** 고객 환경에서 돌아가는 워크플로 v2, 판단 사례 3건 → 10~12주차\n\n---\n\n## A. 실습 자료\n\n### 과제\n1. **환경 이전:** 개인 실습 환경에 있던 지침, 스킬, 컨텍스트 그래프를 고객사의 사내 승인 에이전트 환경으로 옮깁니다. 이전 체크리스트를 작성합니다.\n2. **윤태호 차장과 VOC 마스킹 합의서:** 할인 문구를 가리는 규칙을 정하고, 윤 차장의 서명을 받는 형식으로 문서화합니다.\n3. **한경수 부장 판단 사례 3건 기록 (\"상황 + 판단 + 이유\"):** 그중 1건은 아래 실제 요청으로 합니다.\n   > 성우자동화가 DS3-100 특판가를 요청했습니다. Zhenli ZL-100이 245천 원에 들어오고 있고, 대리점 재고는 340대입니다.\n4. **오지민 사원 첫 단독 주간 실행:** FDE는 옆에서 관찰만 합니다. 막힌 지점을 기록합니다.\n\n### 제출 양식\n```\n9-1_환경이전체크리스트.md\n9-2_VOC마스킹합의서.md\n9-3_판단사례_3건.md\n9-4_오지민_첫실행관찰.md\n```", "csv": null, "cls": ""}, {"id": "w10", "group": "캡스톤 (혼자 수행)", "label": "10주차", "md": "# 10주차 (캡스톤 2/4): 지식 충돌 재연과 첫 월간 리포트\n\n- **이어받는 것:** 9주차 고객 환경 워크플로 v2, VOC 마스킹 합의, 6주차 충돌 해결 기록\n- **넘기는 것:** 부서 간 숫자 대사표, 7월 월간 리포트 → 11주차 DX-7 판단 자료의 수요 근거\n\n---\n\n## A. 실습 자료\n\n### 이벤트\n월요일 본부 회의에서 숫자가 맞지 않습니다.\n- **윤태호 차장 (영업):** \"일체형 원하는 고객이 7곳이고 수요가 2,400대 넘습니다.\"\n- **문서진 팀장 (상품기획):** \"VOC상 신규요구는 4개 회사, 8건입니다.\"\n- **강 전무:** \"누구 숫자가 맞습니까?\"\n\n### 과제\n1. **숫자 대사표:** 두 숫자가 각각 무엇을 셌는지 분해하고, 하나의 통합 뷰를 제시합니다.\n2. 이 충돌을 **지식 PR**로 만들어 컨텍스트 그래프에 반영합니다.\n3. **7월 월간 리포트:** 오지민이 생성하고 FDE가 검토합니다. 리포트에 대사 결과를 반영합니다.\n\n### 제출 양식\n```\n10-1_숫자대사표.md\n10-2_지식PR_수요집계기준.md\n10-3_7월월간리포트.md (+ 검토 코멘트)\n```\n\n### 평가\n제출 후 강사 피드백 때 평가 기준과 함께 안내합니다.\n", "csv": null, "cls": ""}, {"id": "w11", "group": "캡스톤 (혼자 수행)", "label": "11주차", "md": "# 11주차 (캡스톤 3/4): 성공 기준 변경, DX-7 Go/No-go 근거 자료\n\n- **이어받는 것:** 7주차 분기 메모와 평가셋, 10주차 숫자 대사표, 9주차 판단 사례, 5주차 범위 변경 메모(가격 포지셔닝 약속)\n- **넘기는 것:** DX-7 판단 근거 패키지, `go_nogo_memo`와 `prd_draft` 스킬 → 12주차 최종 보고, 메인테이너 인수\n\n---\n\n## A. 실습 자료\n\n### 이벤트\n화요일에 강 전무가 연락합니다.\n> \"월간 리포트 자동화는 좋습니다. 그런데 이사회 전에 제가 정말 필요한 건 **DX-7을 할지 말지 판단할 근거**입니다. 8월 첫째 주까지 가능합니까?\"\n\n### 과제\n0. **어프로치 메모 (반 쪽, 11-02):** 바로 `go_nogo_memo` 스킬을 만들지 않습니다. 신제품 출시 판단 자료를 어떤 구성으로 만들지 2~3안을 조사·비교하고, 화요일 오후 전무와 10분 통화로 하나를 정합니다. 5주차 리서치 브리프와 같은 규칙(출처 필수, 실패 시 복귀 계획)을 적용합니다.\n1. **범위 변경 대응:** 남은 기간(11~12주차)과 인수 일정을 지키면서 수용하는 계획을 씁니다.\n2. **DX-7 Go/No-go 근거 자료 (본문 1쪽 + 부록):** FDE는 결정하지 않습니다. 결정에 필요한 근거와 미확인 사항을 정리합니다.\n3. **가격 포지셔닝 1쪽:** 5주차에 약속한 것입니다. 경쟁 제품 가격 범위와 원가 확인 필요 항목을 정리합니다.\n4. **스킬 추가:** `go_nogo_memo`와 `prd_draft`를 기존 버티컬에 연결합니다. 새 에이전트는 만들지 않습니다.\n\n### 제출 양식\n```\n11-0_어프로치메모.md\n11-1_범위변경계획.md\n11-2_DX7_GoNogo_근거.md\n11-3_가격포지셔닝.md\n11-4_스킬추가_diff.md\n```\n\n### 평가\n제출 후 강사 피드백 때 평가 기준과 함께 안내합니다.\n", "csv": null, "cls": ""}, {"id": "w12", "group": "캡스톤 (혼자 수행)", "label": "12주차", "md": "# 12주차 (캡스톤 4/4): 메인테이너 재선정, 인수 완료, 퇴장\n\n- **이어받는 것:** 8주차 인수 패키지 v1과 역할표, 9주차 판단 사례 3건, 9주차 오지민 관찰 기록(PR 후보), 11주차 산출물\n- **넘기는 것:** (고객사에) 인수 완료된 운영 체계. (수강생에게) 1인 FDE 투입 준비도 평가\n\n---\n\n## A. 실습 자료\n\n### 이벤트\n월요일에 한경수 부장이 건강 문제로 2개월 휴직합니다. 지식 검토자가 비었습니다.\n\n### 과제\n1. **메인테이너 체계 재편:** 지식 검토자 공백을 메우는 방안을 토폴로지 맵을 보며 고객사와 결정합니다 (10-05).\n2. **인수 완료 확인:** 오지민이 FDE 없이 다음 두 가지를 수행합니다.\n   - ① 지식 PR 1건 처리: 9주차에 발견한 \"케이로보\" 별칭 추가, 또는 3주차 시나리오인 \"안전·인증\" 분류 추가\n   - ② 8월 월간 리포트 생성\n3. **최종 보고 (강 전무, 1쪽):** 이사회에서 쓸 수 있는 사례 형식으로 씁니다.\n4. **퇴장 회고와 1인 FDE 준비도 자가평가:** `instructor/solo_fde_readiness.md`를 사용합니다.\n\n### 제출 양식\n```\n12-1_메인테이너재편안.md\n12-2_인수완료확인서.md\n12-3_최종보고.md\n12-4_회고_준비도자가평가.md\n```", "csv": null, "cls": ""}, {"id": "readiness", "group": "수료", "label": "준비도 자가평가", "md": "# 1인 FDE 투입 준비도 평가와 실전 첫 2주 플레이북\n\n> 12주차에 수강생이 자가평가하고, 강사가 같은 표로 평가합니다. 두 점수의 차이가 큰 항목이 수료 후 보완 과제가 됩니다.\n> 최종 목표는 \"실제 조직의 AX에 1인 FDE로 투입될 수 있는 상태\"입니다.\n\n---\n\n## 1. 준비도 평가 (13개 역량)\n\n**점수 기준**\n- 0점: 못 함\n- 1점: 도움을 받으면 함\n- 2점: 혼자 함\n- 3점: 혼자 하고 남에게 가르칠 수 있음\n\n| # | 역량 | 증거 (어느 주차 산출물) | 근거 영상 | 자가 | 강사 |\n|---|---|---|---|---|---|\n| 1 | RFP에서 SI 문법을 찾아 FDE 방식으로 다시 쓴다 | W1 제안서, W3 설계서 | 07-06, 08-12 | | |\n| 2 | 본인 업무를 비가역적으로 자동화하고 스킬로 만든다 | W2 스킬 | 02-27 | | |\n| 3 | 데이터 등급을 분류하고 승인 경로를 확보한다 | W3 매트릭스, W4 등급표, W9 이전 체크리스트 | 03-11 | | |\n| 4 | 숨은 키맨을 찾는다 | W4 맵 v2 (윤태호) | 10-05 | | |\n| 5 | 진짜 KPI를 끌어내는 질문을 한다 | W4 인터뷰 노트 | 10-05 | | |\n| 6 | 난제를 판별하고 범위 변경에 먼저 대안을 낸다 | W5 판정표·메모, W11 계획 | 10-09 | | |\n| 7 | 암묵지를 지시 로그와 인터뷰에서 추출하고 태깅한다 | W6 그래프 | 04-09 | | |\n| 8 | 지식 충돌을 3단계로 해결한다 | W6, W10 | 04-09 | | |\n| 9 | 버티컬 워크플로를 스킬 연결로 구현한다 | W7, W11 | 06-11, 07-06 | | |\n| 10 | 강건성·성능 평가와 워크슬롭 검수를 한다 | W7 평가셋, W10 검토 코멘트 | 03-11, 04-21 | | |\n| 11 | 메인테이너를 양성하고 인수를 완료한다 | W8 패키지, W12 확인서 | 08-12, 09-30 | | |\n| 12 | 혼자서도 부담을 나누는 구조를 운영한다 | W8 계획, 주간 공유 기록 | 07-14 | | |\n| 13 | 구현 전에 최신 자료를 조사해 접근 방식을 고객과 합의한다 (출처 확인 포함) | W5 리서치 브리프, W11 어프로치 메모 | 11-02 | | |\n\n> 파운더 스피릿(야망, 집착, 끈기, 롱텀에서 지치지 않음)은 이 표에서 점수로 매기지 않습니다. 화자는 스피릿을 \"시험이 아니라 관찰\"로 찾으라고 말합니다 (11-05). 강사는 과정 중 관찰한 신호를 별도 관찰 노트로 남깁니다.\n\n**판정**\n- **투입 가능:** 모든 항목 2점 이상이고, 4·6·11번은 3점\n- **조건부 투입:** 2점 미만이 2개 이하이고, 경력 FDE의 멘토링을 받는 조건\n- **추가 훈련:** 위 조건에 미달\n\n---\n\n", "csv": null, "cls": ""}];

// csv
function parseCSV(t){const rows=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"')q=true;else if(c==','){r.push(f);f=""}else if(c=='\n'){r.push(f);rows.push(r);r=[];f=""}else if(c!='\r')f+=c}
  if(f||r.length){r.push(f);rows.push(r)}return rows}
function csvHTML(s){const rows=parseCSV(s.csv.trim());const h=rows.shift();
  return `<h1>${esc(s.label)}</h1><div class="csvmeta"><span>${rows.length}행 · ${h.length}열</span><span>원본 파일: case/data/${esc(s.label)}</span></div>
  <div class="csvwrap"><table><thead><tr>${h.map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}

marked.setOptions({gfm:true,breaks:false});
const dark=()=>document.documentElement.dataset.theme==="dark"||(!document.documentElement.dataset.theme&&matchMedia("(prefers-color-scheme: dark)").matches);
try{mermaid.initialize({startOnLoad:false,theme:dark()?"dark":"neutral",securityLevel:"strict"})}catch(e){}

function render(id){
  const i=Math.max(0,S.findIndex(s=>s.id===id));const s=S[i];const doc=document.getElementById("doc");
  if(s.cls==="gated"&&MODE==="student"&&!unlocked[s.id]){
    doc.innerHTML=`<h1>${esc(s.label)}</h1><div class="notice">이 자료는 <b>6주차</b> 실습 자료입니다. 강사가 공개를 안내하기 전에는 열지 마세요. 4~5주차에는 이 정보 없이 인터뷰로 찾아내는 것이 과제입니다.<br><button type="button" id="unlock">6주차가 되어 자료를 엽니다</button></div>`;
    document.getElementById("unlock").onclick=()=>{unlocked[s.id]=1;try{localStorage.setItem("fde-unlock",JSON.stringify(unlocked))}catch(e){}render(s.id)};
  }else if(s.csv){doc.innerHTML=csvHTML(s)}
  else{
    doc.innerHTML=marked.parse(s.md);
    doc.querySelectorAll("table").forEach(t=>{const w=document.createElement("div");w.className="tw";t.replaceWith(w);w.appendChild(t)});
    const ans=[...doc.querySelectorAll("h2")].find(h=>h.textContent.trim().startsWith("B. 예상 산출물"));
    if(ans){const box=document.createElement("section");box.className="answer";ans.before(box);let n=ans;while(n){const nx=n.nextSibling;box.appendChild(n);n=nx}}
    const ms=doc.querySelectorAll("pre code.language-mermaid");
    ms.forEach(c=>{const d=document.createElement("div");d.className="mermaid";d.textContent=c.textContent;c.parentElement.replaceWith(d)});
    if(ms.length){try{mermaid.run({nodes:doc.querySelectorAll(".mermaid")})}catch(e){}}
  }
  document.querySelectorAll("nav.idx a").forEach(a=>{if(a.dataset.id!==s.id)a.removeAttribute("aria-current");else a.setAttribute("aria-current","page")});
  document.getElementById("mnav").value=s.id;
  const p=S[i-1],n=S[i+1],P=document.getElementById("prev"),N=document.getElementById("next");
  P.hidden=!p;N.hidden=!n;
  if(p){P.href="#"+p.id;P.innerHTML=`<span>← 이전</span>${esc(p.label)}`}
  if(n){N.href="#"+n.id;N.innerHTML=`<span>다음 →</span>${esc(n.label)}`}
}
function route(){const id=location.hash.slice(1)||S[0].id;render(id);if(location.hash)window.scrollTo({top:0})}
addEventListener("hashchange",route);
route();
</script>
